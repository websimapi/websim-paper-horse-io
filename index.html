<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Horse-io</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #87CEEB, #98FB98);
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            max-width: 400px;
            width: 90vw;
            text-align: center;
        }

        #horseCreator {
            display: block;
        }

        #horseCreator h3 {
            margin-top: 0;
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .form-group {
            margin: 15px 0;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        #horsePrompt {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            margin: 10px 0;
        }

        #gameUI {
            display: none;
        }

        .stat-bar {
            margin: 10px 0;
            background: #e0e0e0;
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
        }

        .stat-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .speed-bar { background: #4CAF50; }
        .stamina-bar { background: #2196F3; }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin: 10px 0;
            width: 100%;
            transition: transform 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        #horsePreview {
            width: 100px;
            height: 100px;
            margin: 10px auto;
            border-radius: 10px;
            border: 2px solid #ddd;
            display: none;
            object-fit: cover;
        }

        #playersList {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-height: 300px;
            overflow-y: auto;
            min-width: 200px;
            display: none;
        }

        .player-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
            padding: 5px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.5);
        }

        .player-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin-right: 10px;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            display: none;
        }

        .loading {
            text-align: center;
            color: #666;
            font-style: italic;
        }

        .horse-label {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            pointer-events: none;
            z-index: 1000;
            transform: translate(-50%, -50%);
        }

        .food-boost-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(76, 175, 80, 0.95);
            color: white;
            padding: 15px 25px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            z-index: 2000;
            animation: boostPopup 2s ease-out forwards;
            pointer-events: none;
        }

        .food-boost-popup.rare {
            background: rgba(255, 193, 7, 0.95);
            animation: rareBoostPopup 3s ease-out forwards;
        }

        @keyframes boostPopup {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
            100% { opacity: 0; transform: translate(-50%, -70%) scale(1); }
        }

        @keyframes rareBoostPopup {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            80% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
            100% { opacity: 0; transform: translate(-50%, -70%) scale(1); }
        }

        .horse-chat {
            background: rgba(255, 255, 255, 0.95);
            color: black;
            padding: 8px 12px;
            border-radius: 20px;
            margin-bottom: 5px;
            font-size: 14px;
            max-width: 200px;
            word-wrap: break-word;
            display: none;
        }

        .horse-name-container {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 15px;
        }

        #chatInput {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 16px;
            width: 300px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            display: none;
            z-index: 1001;
        }

        #chatButton {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 50%;
            font-size: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            cursor: pointer;
            z-index: 1001;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #chatButton:hover {
            background: rgba(255, 255, 255, 1);
            transform: translateX(-50%) scale(1.1);
        }

        #chatButton.disabled {
            background: rgba(255, 100, 100, 0.95);
            border-color: #ff6666;
        }

        #chatButton.disabled:hover {
            background: rgba(255, 100, 100, 1);
            transform: translateX(-50%) scale(1.1);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui">
            <div id="horseCreator">
                <h3> Create Your Steed</h3>
                
                <div class="form-group">
                    <label for="horsePrompt">Describe your horse:</label>
                    <input type="text" id="horsePrompt" placeholder="e.g., majestic, wild, elegant, powerful..." />
                </div>
                
                <div class="form-group">
                    <label for="horseColor">Primary Color:</label>
                    <select id="horseColor">
                        <option value="brown">Brown</option>
                        <option value="black">Black</option>
                        <option value="white">White</option>
                        <option value="chestnut">Chestnut</option>
                        <option value="gray">Gray</option>
                        <option value="palomino">Palomino</option>
                        <option value="bay">Bay</option>
                        <option value="pinto">Pinto</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="horseType">Horse Type:</label>
                    <select id="horseType">
                        <option value="stallion">Stallion</option>
                        <option value="mare">Mare</option>
                        <option value="mustang">Mustang</option>
                        <option value="thoroughbred">Thoroughbred</option>
                        <option value="arabian">Arabian</option>
                        <option value="clydesdale">Clydesdale</option>
                        <option value="friesian">Friesian</option>
                        <option value="appaloosa">Appaloosa</option>
                    </select>
                </div>
                
                <img id="horsePreview" />
                <button id="generateHorse"> Generate My Horse</button>
                <button id="startGame" disabled> Enter the Field!</button>
                <div class="loading" id="loadingText" style="display: none;">Crafting your magnificent steed... </div>
            </div>
            
            <div id="gameUI">
                <h3>Your Horse Stats</h3>
                <div>Speed: <span id="speedValue">0</span></div>
                <div class="stat-bar">
                    <div class="stat-fill speed-bar" id="speedBar" style="width: 0%"></div>
                </div>
                <div>Stamina: <span id="staminaValue">100</span></div>
                <div class="stat-bar">
                    <div class="stat-fill stamina-bar" id="staminaBar" style="width: 100%"></div>
                </div>
                <button id="gallop">Gallop! (Hold)</button>
            </div>
        </div>

        <div id="playersList">
            <h4>Horses in Field</h4>
            <div id="playersContainer"></div>
        </div>

        <div id="controls" style="display: none;">
            <div>Use WASD or Arrow Keys to move your horse</div>
            <div>Hold Gallop button to run faster (uses stamina)</div>
        </div>

        <input type="text" id="chatInput" placeholder="Type to chat..." maxlength="100" />
        <button id="chatButton"> </button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
            "three/controls": "https://unpkg.com/three@0.158.0/examples/jsm/controls/OrbitControls.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/controls';

        // Game state
        let scene, camera, renderer, controls;
        let horses = new Map();
        let myHorse = null;
        let myHorseStats = { speed: 50, stamina: 100, maxStamina: 100 };
        let room = null;
        let gameStarted = false;
        let keys = {};
        let isGalloping = false;
        let terrainChunks = new Map();
        let chunkSize = 50;
        let renderDistance = 3; // Number of chunks in each direction
        let horseLabels = new Map();
        let chatInput = null;
        let chatTimeouts = new Map();
        let chatDisabled = false;
        let foodItems = new Map(); // Map to store food items by chunk
        let consumedFoodIds = new Set(); // Track consumed food IDs

        // Food types with different rarities and effects
        const foodTypes = [
            { name: 'Grass', color: 0x32CD32, rarity: 0.7, staminaBoost: 10, type: 'common' },
            { name: 'Apple', color: 0xFF0000, rarity: 0.2, staminaBoost: 25, type: 'uncommon' },
            { name: 'Carrot', color: 0xFF8C00, rarity: 0.15, staminaBoost: 20, type: 'uncommon' },
            { name: 'Sugar Cube', color: 0xFFFFFF, rarity: 0.05, staminaBoost: 30, speedBoost: 5, type: 'rare' },
            { name: 'Golden Oats', color: 0xFFD700, rarity: 0.02, staminaBoost: 50, speedBoost: 10, maxStaminaBoost: 10, type: 'legendary' }
        ];

        // UI elements
        const horseCreator = document.getElementById('horseCreator');
        const gameUI = document.getElementById('gameUI');
        const horsePrompt = document.getElementById('horsePrompt');
        const horseColor = document.getElementById('horseColor');
        const horseType = document.getElementById('horseType');
        const horsePreview = document.getElementById('horsePreview');
        const generateBtn = document.getElementById('generateHorse');
        const startBtn = document.getElementById('startGame');
        const loadingText = document.getElementById('loadingText');
        const gallopBtn = document.getElementById('gallop');
        const controlsDiv = document.getElementById('controls');
        const playersContainer = document.getElementById('playersContainer');
        chatInput = document.getElementById('chatInput');
        const chatButton = document.getElementById('chatButton');

        function createHorseSprite(imageUrl) {
            return new Promise((resolve) => {
                const textureLoader = new THREE.TextureLoader();
                const texture = textureLoader.load(
                    imageUrl,
                    () => {
                        // Texture loaded successfully
                        texture.magFilter = THREE.NearestFilter;
                        texture.minFilter = THREE.LinearFilter;
                        
                        const spriteMaterial = new THREE.SpriteMaterial({ 
                            map: texture,
                            transparent: true,
                            alphaTest: 0.1
                        });
                        const sprite = new THREE.Sprite(spriteMaterial);
                        sprite.scale.set(4, 4, 1);
                        sprite.position.y = 4;
                        
                        resolve(sprite);
                    },
                    undefined,
                    (error) => {
                        console.error('Error loading horse texture:', error);
                        // Create a fallback colored sprite
                        const fallbackMaterial = new THREE.SpriteMaterial({ color: 0x8B4513 });
                        const sprite = new THREE.Sprite(fallbackMaterial);
                        sprite.scale.set(4, 4, 1);
                        sprite.position.y = 4;
                        resolve(sprite);
                    }
                );
            });
        }

        function createTree() {
            const group = new THREE.Group();
            
            // Trunk
            const trunkGeometry = new THREE.CylinderGeometry(0.5, 0.8, 4);
            const trunkMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
            const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
            trunk.position.y = 2;
            trunk.castShadow = true;
            group.add(trunk);

            // Leaves
            const leavesGeometry = new THREE.SphereGeometry(3);
            const leavesMaterial = new THREE.MeshLambertMaterial({ color: 0x228B22 });
            const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);
            leaves.position.y = 5;
            leaves.castShadow = true;
            group.add(leaves);

            return group;
        }

        // Initialize Three.js scene
        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 6, 8);

            renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('gameCanvas'),
                antialias: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            generateInitialTerrain();

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(50, 50, 50);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enablePan = false;
            controls.enableZoom = false;
            controls.maxPolarAngle = Math.PI / 2.2;
            controls.minDistance = 5;
            controls.maxDistance = 15;
        }

        function generateInitialTerrain() {
            for (let x = -renderDistance; x <= renderDistance; x++) {
                for (let z = -renderDistance; z <= renderDistance; z++) {
                    createTerrainChunk(x, z);
                }
            }
        }

        function createTerrainChunk(chunkX, chunkZ) {
            const chunkKey = `${chunkX},${chunkZ}`;
            if (terrainChunks.has(chunkKey)) return;

            const chunkGroup = new THREE.Group();
            
            // Create field chunk
            const fieldGeometry = new THREE.PlaneGeometry(chunkSize, chunkSize);
            const fieldMaterial = new THREE.MeshLambertMaterial({ color: 0x90EE90 });
            const field = new THREE.Mesh(fieldGeometry, fieldMaterial);
            field.rotation.x = -Math.PI / 2;
            field.position.set(chunkX * chunkSize, 0, chunkZ * chunkSize);
            field.receiveShadow = true;
            chunkGroup.add(field);

            // Add trees to chunk
            const treeCount = Math.floor(Math.random() * 8) + 3;
            for (let i = 0; i < treeCount; i++) {
                const tree = createTree();
                tree.position.set(
                    chunkX * chunkSize + (Math.random() - 0.5) * chunkSize * 0.8,
                    0,
                    chunkZ * chunkSize + (Math.random() - 0.5) * chunkSize * 0.8
                );
                chunkGroup.add(tree);
            }

            // Add food items to chunk
            const foods = generateFoodForChunk(chunkX, chunkZ);
            foods.forEach(food => {
                if (!consumedFoodIds.has(food.userData.id)) {
                    chunkGroup.add(food);
                }
            });

            scene.add(chunkGroup);
            terrainChunks.set(chunkKey, chunkGroup);
        }

        function updateTerrain(playerX, playerZ) {
            const playerChunkX = Math.floor(playerX / chunkSize);
            const playerChunkZ = Math.floor(playerZ / chunkSize);

            // Generate new chunks around player
            for (let x = playerChunkX - renderDistance; x <= playerChunkX + renderDistance; x++) {
                for (let z = playerChunkZ - renderDistance; z <= playerChunkZ + renderDistance; z++) {
                    createTerrainChunk(x, z);
                }
            }

            // Remove distant chunks
            for (let [chunkKey, chunkGroup] of terrainChunks) {
                const [chunkX, chunkZ] = chunkKey.split(',').map(Number);
                const distance = Math.max(Math.abs(chunkX - playerChunkX), Math.abs(chunkZ - playerChunkZ));
                
                if (distance > renderDistance + 1) {
                    scene.remove(chunkGroup);
                    terrainChunks.delete(chunkKey);
                    // Also remove food items from memory
                    foodItems.delete(chunkKey);
                }
            }
        }

        // Multiplayer setup
        async function initMultiplayer() {
            room = new WebsimSocket();
            await room.initialize();

            room.subscribePresence((currentPresence) => {
                updatePlayersList();
                updateHorsePositions();
            });

            // Subscribe to food consumption records
            room.collection('food_consumption').subscribe((consumptions) => {
                consumptions.forEach(consumption => {
                    consumedFoodIds.add(consumption.food_id);
                    // Remove food from scene if it exists
                    removeFoodFromScene(consumption.food_id);
                });
            });

            room.onmessage = (event) => {
                const data = event.data;
                switch (data.type) {
                    case "connected":
                        console.log(`${data.username} joined the field!`);
                        break;
                    case "disconnected":
                        console.log(`${data.username} left the field!`);
                        removeHorse(data.clientId);
                        break;
                }
            };
        }

        function removeFoodFromScene(foodId) {
            // Find and remove food from all chunks
            terrainChunks.forEach((chunkGroup, chunkKey) => {
                const foods = foodItems.get(chunkKey) || [];
                foods.forEach((food, index) => {
                    if (food.userData.id === foodId) {
                        chunkGroup.remove(food);
                        foods.splice(index, 1);
                    }
                });
            });
        }

        function createFood(foodType, position) {
            const geometry = new THREE.SphereGeometry(0.5, 8, 6);
            const material = new THREE.MeshLambertMaterial({ color: foodType.color });
            const food = new THREE.Mesh(geometry, material);
            food.position.copy(position);
            food.position.y = 0.5;
            food.castShadow = true;
            food.userData = {
                ...foodType,
                id: Math.random().toString(36).substr(2, 9),
                chunkKey: null
            };
            return food;
        }

        function generateFoodForChunk(chunkX, chunkZ) {
            const chunkKey = `${chunkX},${chunkZ}`;
            const foods = [];
            
            // Generate 3-8 food items per chunk
            const foodCount = Math.floor(Math.random() * 6) + 3;
            
            for (let i = 0; i < foodCount; i++) {
                // Select random food type based on rarity
                const rand = Math.random();
                let selectedFood = foodTypes[0]; // Default to grass
                
                for (const foodType of foodTypes) {
                    if (rand <= foodType.rarity) {
                        selectedFood = foodType;
                        break;
                    }
                }
                
                const position = new THREE.Vector3(
                    chunkX * chunkSize + (Math.random() - 0.5) * chunkSize * 0.8,
                    0,
                    chunkZ * chunkSize + (Math.random() - 0.5) * chunkSize * 0.8
                );
                
                const food = createFood(selectedFood, position);
                food.userData.chunkKey = chunkKey;
                foods.push(food);
            }
            
            foodItems.set(chunkKey, foods);
            return foods;
        }

        async function consumeFood(food) {
            if (consumedFoodIds.has(food.userData.id)) return;

            // Mark as consumed locally immediately
            consumedFoodIds.add(food.userData.id);
            
            // Apply stat boosts
            let message = `+${food.userData.staminaBoost} Stamina`;
            let isRare = false;

            myHorseStats.stamina = Math.min(
                myHorseStats.maxStamina, 
                myHorseStats.stamina + food.userData.staminaBoost
            );

            if (food.userData.speedBoost) {
                myHorseStats.speed += food.userData.speedBoost;
                message += `, +${food.userData.speedBoost} Speed`;
                isRare = true;
            }

            if (food.userData.maxStaminaBoost) {
                myHorseStats.maxStamina += food.userData.maxStaminaBoost;
                myHorseStats.stamina += food.userData.maxStaminaBoost; // Also add to current stamina
                message += `, +${food.userData.maxStaminaBoost} Max Stamina`;
                isRare = true;
            }

            // Show boost popup
            showBoostPopup(message, isRare);

            // Update UI
            updateStatsUI();

            // Update multiplayer presence with new stats
            room.updatePresence({
                stats: { ...myHorseStats },
                stamina: myHorseStats.stamina
            });

            // Record consumption in database
            try {
                await room.collection('food_consumption').create({
                    food_id: food.userData.id,
                    food_type: food.userData.name,
                    rarity: food.userData.type,
                    stamina_boost: food.userData.staminaBoost,
                    speed_boost: food.userData.speedBoost || 0,
                    max_stamina_boost: food.userData.maxStaminaBoost || 0,
                    horse_stats: { ...myHorseStats }
                });
            } catch (error) {
                console.error('Error recording food consumption:', error);
            }

            // Remove from scene
            removeFoodFromScene(food.userData.id);
        }

        function showBoostPopup(message, isRare = false) {
            const popup = document.createElement('div');
            popup.className = `food-boost-popup ${isRare ? 'rare' : ''}`;
            popup.textContent = message;
            document.body.appendChild(popup);

            setTimeout(() => {
                document.body.removeChild(popup);
            }, isRare ? 3000 : 2000);
        }

        function checkFoodCollisions() {
            if (!myHorse || !gameStarted) return;

            const horsePosition = myHorse.position;
            const consumeDistance = 3; // Distance at which horse can consume food

            // Check all food items in nearby chunks
            const playerChunkX = Math.floor(horsePosition.x / chunkSize);
            const playerChunkZ = Math.floor(horsePosition.z / chunkSize);

            for (let x = playerChunkX - 1; x <= playerChunkX + 1; x++) {
                for (let z = playerChunkZ - 1; z <= playerChunkZ + 1; z++) {
                    const chunkKey = `${x},${z}`;
                    const foods = foodItems.get(chunkKey) || [];

                    foods.forEach(food => {
                        if (consumedFoodIds.has(food.userData.id)) return;

                        const distance = horsePosition.distanceTo(food.position);
                        if (distance < consumeDistance) {
                            consumeFood(food);
                        }
                    });
                }
            }
        }

        function setupControls() {
            document.addEventListener('keydown', (e) => {
                // If typing in chat, don't move horse
                if (chatInput && document.activeElement === chatInput) {
                    if (e.code === 'Enter') {
                        sendChatMessage();
                        e.preventDefault();
                    }
                    if (e.code === 'Escape') {
                        hideChatInput();
                        e.preventDefault();
                    }
                    return;
                }

                keys[e.code] = true;
                if (e.code === 'Space') {
                    e.preventDefault();
                    isGalloping = true;
                }
            });
            document.addEventListener('keyup', (e) => {
                keys[e.code] = false;
                if (e.code === 'Space') {
                    isGalloping = false;
                }
            });

            gallopBtn.addEventListener('mousedown', () => {
                isGalloping = true;
            });

            gallopBtn.addEventListener('mouseup', () => {
                isGalloping = false;
            });

            gallopBtn.addEventListener('mouseleave', () => {
                isGalloping = false;
            });

            // Chat button functionality
            chatButton.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!chatDisabled) {
                    showChatInput();
                }
            });

            // Right-click and long-tap to toggle chat disable
            let longTapTimer = null;
            
            chatButton.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                toggleChatDisabled();
            });

            chatButton.addEventListener('touchstart', (e) => {
                longTapTimer = setTimeout(() => {
                    toggleChatDisabled();
                }, 500);
            });

            chatButton.addEventListener('touchend', (e) => {
                if (longTapTimer) {
                    clearTimeout(longTapTimer);
                    longTapTimer = null;
                }
            });

            chatButton.addEventListener('touchcancel', (e) => {
                if (longTapTimer) {
                    clearTimeout(longTapTimer);
                    longTapTimer = null;
                }
            });

            // Hide chat when clicking outside
            document.addEventListener('click', (e) => {
                if (chatInput.style.display === 'block' && 
                    !chatInput.contains(e.target) && 
                    !chatButton.contains(e.target)) {
                    hideChatInput();
                }
            });

            chatInput.addEventListener('blur', () => {
                // Small delay to allow for other click events to process
                setTimeout(() => {
                    if (document.activeElement !== chatInput) {
                        hideChatInput();
                    }
                }, 100);
            });
        }

        function showChatInput() {
            if (chatInput && chatButton) {
                chatInput.style.display = 'block';
                chatButton.style.display = 'none';
                chatInput.focus();
            }
        }

        function hideChatInput() {
            if (chatInput && chatButton) {
                chatInput.style.display = 'none';
                chatButton.style.display = 'flex';
                chatInput.value = '';
                chatInput.blur();
            }
        }

        function toggleChatDisabled() {
            chatDisabled = !chatDisabled;
            if (chatDisabled) {
                chatButton.classList.add('disabled');
                hideChatInput();
            } else {
                chatButton.classList.remove('disabled');
            }
        }

        function sendChatMessage() {
            const message = chatInput.value.trim();
            if (message) {
                room.updatePresence({
                    chatMessage: message,
                    chatTimestamp: Date.now()
                });
                
                // Hide chat message after 5 seconds
                setTimeout(() => {
                    room.updatePresence({
                        chatMessage: null,
                        chatTimestamp: null
                    });
                }, 5000);
                
                // Clear input but keep it open
                chatInput.value = '';
                chatInput.focus();
            }
        }

        function updateMovement() {
            if (!myHorse || !gameStarted) return;

            let moveX = 0;
            let moveZ = 0;
            
            if (keys['KeyW'] || keys['ArrowUp']) moveZ -= 1;
            if (keys['KeyS'] || keys['ArrowDown']) moveZ += 1;
            if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
            if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

            if (moveX !== 0 || moveZ !== 0) {
                const speedMultiplier = isGalloping && myHorseStats.stamina > 0 ? 2 : 1;
                const baseSpeed = myHorseStats.speed / 1000;
                const actualSpeed = baseSpeed * speedMultiplier;

                myHorse.position.x += moveX * actualSpeed;
                myHorse.position.z += moveZ * actualSpeed;

                // Update stamina
                if (isGalloping && myHorseStats.stamina > 0) {
                    myHorseStats.stamina = Math.max(0, myHorseStats.stamina - 0.5);
                } else if (!isGalloping && myHorseStats.stamina < myHorseStats.maxStamina) {
                    myHorseStats.stamina = Math.min(myHorseStats.maxStamina, myHorseStats.stamina + 0.2);
                }

                // Update UI
                updateStatsUI();

                // Update multiplayer position
                room.updatePresence({
                    x: myHorse.position.x,
                    z: myHorse.position.z,
                    stamina: myHorseStats.stamina
                });

                // Update terrain chunks
                updateTerrain(myHorse.position.x, myHorse.position.z);

                // Update camera to follow horse smoothly
                const targetCameraX = myHorse.position.x;
                const targetCameraZ = myHorse.position.z + 6;
                const targetCameraY = 6;
                
                camera.position.x += (targetCameraX - camera.position.x) * 0.1;
                camera.position.z += (targetCameraZ - camera.position.z) * 0.1;
                camera.position.y += (targetCameraY - camera.position.y) * 0.1;
                
                controls.target.set(myHorse.position.x, 2, myHorse.position.z);
            }

            // Check for food collisions
            checkFoodCollisions();
        }

        function updateStatsUI() {
            document.getElementById('speedValue').textContent = myHorseStats.speed;
            document.getElementById('staminaValue').textContent = Math.floor(myHorseStats.stamina);
            
            document.getElementById('speedBar').style.width = `${(myHorseStats.speed / 75) * 100}%`;
            document.getElementById('staminaBar').style.width = `${(myHorseStats.stamina / myHorseStats.maxStamina) * 100}%`;
        }

        function createHorseLabel(clientId, username, avatarUrl) {
            const label = document.createElement('div');
            label.className = 'horse-label';
            label.innerHTML = `
                <div class="horse-chat"></div>
                <div class="horse-name-container">
                    <img src="${avatarUrl}" />
                    <span>${username}</span>
                </div>
            `;
            document.body.appendChild(label);
            horseLabels.set(clientId, label);
            return label;
        }

        function updateHorseLabels() {
            horseLabels.forEach((label, clientId) => {
                const horse = horses.get(clientId) || (clientId === room.clientId ? myHorse : null);
                if (horse) {
                    const vector = new THREE.Vector3();
                    vector.setFromMatrixPosition(horse.matrixWorld);
                    vector.y += 1.5; // Position above horse
                    vector.project(camera);

                    const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                    const y = (vector.y * -0.5 + 0.5) * window.innerHeight;

                    label.style.left = x + 'px';
                    label.style.top = y + 'px';
                    
                    // Hide labels when chat is disabled
                    if (chatDisabled) {
                        label.style.display = 'none';
                    } else {
                        label.style.display = vector.z < 1 ? 'flex' : 'none';
                        
                        // Update chat message
                        const presence = room.presence[clientId];
                        const chatDiv = label.querySelector('.horse-chat');
                        if (presence && presence.chatMessage && presence.chatTimestamp) {
                            const timeSince = Date.now() - presence.chatTimestamp;
                            if (timeSince < 5000) { // Show for 5 seconds
                                chatDiv.textContent = presence.chatMessage;
                                chatDiv.style.display = 'block';
                            } else {
                                chatDiv.style.display = 'none';
                            }
                        } else {
                            chatDiv.style.display = 'none';
                        }
                    }
                }
            });
        }

        function updatePlayersList() {
            if (!room || !playersContainer) return;
            
            playersContainer.innerHTML = '';
            
            Object.values(room.peers).forEach(peer => {
                const playerDiv = document.createElement('div');
                playerDiv.className = 'player-item';
                playerDiv.innerHTML = `
                    <img class="player-avatar" src="${peer.avatarUrl}" alt="${peer.username}" />
                    <span>${peer.username}</span>
                `;
                playersContainer.appendChild(playerDiv);
            });
        }

        async function updateHorsePositions() {
            if (!room) return;
            
            for (const [clientId, presence] of Object.entries(room.presence)) {
                if (clientId === room.clientId) continue; // Skip own horse
                
                if (presence.horseImage && presence.x !== undefined && presence.z !== undefined) {
                    let horse = horses.get(clientId);
                    
                    if (!horse) {
                        // Create new horse sprite
                        horse = await createHorseSprite(presence.horseImage);
                        scene.add(horse);
                        horses.set(clientId, horse);
                        
                        // Create label for this horse
                        const peer = room.peers[clientId];
                        if (peer) {
                            createHorseLabel(clientId, peer.username, peer.avatarUrl);
                        }
                    }
                    
                    // Update position smoothly
                    horse.position.x += (presence.x - horse.position.x) * 0.1;
                    horse.position.z += (presence.z - horse.position.z) * 0.1;
                }
            }
        }

        function removeHorse(clientId) {
            const horse = horses.get(clientId);
            if (horse) {
                scene.remove(horse);
                horses.delete(clientId);
            }
            const label = horseLabels.get(clientId);
            if (label) {
                document.body.removeChild(label);
                horseLabels.delete(clientId);
            }
        }

        // Horse generation
        async function generateHorse() {
            const userPrompt = horsePrompt.value.trim() || "beautiful running";
            const horseColor = document.getElementById('horseColor').value;
            const horseType = document.getElementById('horseType').value;
            
            const fullPrompt = `${horseColor} ${horseType} horse ${userPrompt}`;
            const horseWeightedPrompt = `horse ${fullPrompt.split(' ').map(word => `horse ${word}`).join(' ')} horse`;
            
            generateBtn.disabled = true;
            loadingText.style.display = 'block';
            
            try {
                const result = await websim.imageGen({
                    prompt: `${horseWeightedPrompt}, full body horse, horse game sprite, horse clean background, detailed horse, beautiful horse`,
                    transparent: true,
                    aspect_ratio: "1:1"
                });
                
                // Upload the generated image to get a stable URL
                const response = await fetch(result.url);
                const blob = await response.blob();
                const uploadedUrl = await websim.upload(blob);
                
                horsePreview.src = uploadedUrl;
                horsePreview.style.display = 'block';
                startBtn.disabled = false;
                
                // Generate random stats
                myHorseStats.speed = Math.floor(Math.random() * 50) + 25; // 25-75
                myHorseStats.stamina = 100;
                myHorseStats.maxStamina = Math.floor(Math.random() * 50) + 75; // 75-125
                
                // Store horse data with uploaded URL
                window.myHorseData = {
                    image: uploadedUrl,
                    stats: { ...myHorseStats }
                };
                
            } catch (error) {
                console.error('Error generating horse:', error);
                alert('Failed to generate horse. Please try again.');
            } finally {
                generateBtn.disabled = false;
                loadingText.style.display = 'none';
            }
        }

        // Game loop
        function animate() {
            requestAnimationFrame(animate);
            
            updateMovement();
            updateHorseLabels();
            controls.update();
            renderer.render(scene, camera);
        }

        // Event listeners
        generateBtn.addEventListener('click', generateHorse);
        
        startBtn.addEventListener('click', async () => {
            if (!window.myHorseData) return;

            horseCreator.style.display = 'none';
            gameUI.style.display = 'block';
            controlsDiv.style.display = 'block';
            document.getElementById('ui').style.display = 'block';
            gameStarted = true;

            // Create my horse sprite and wait for it to load
            myHorse = await createHorseSprite(window.myHorseData.image);
            myHorse.position.set(0, 4, 0);
            scene.add(myHorse);

            // Update multiplayer with horse data
            room.updatePresence({
                horseImage: window.myHorseData.image,
                stats: window.myHorseData.stats,
                x: 0,
                z: 0,
                stamina: myHorseStats.stamina
            });

            updateStatsUI();
            
            // Create label for my horse
            const currentUser = room.peers[room.clientId];
            if (currentUser) {
                createHorseLabel(room.clientId, currentUser.username, currentUser.avatarUrl);
            }
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize game
        async function init() {
            initScene();
            await initMultiplayer();
            setupControls();
            animate();
        }

        init();
    </script>
