<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Horse-io</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #87CEEB, #98FB98);
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            max-width: 400px;
            width: 90vw;
            text-align: center;
        }

        #horseCreator {
            display: block;
        }

        #horseCreator h3 {
            margin-top: 0;
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .form-group {
            margin: 15px 0;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        #horsePrompt {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            margin: 10px 0;
        }

        #gameUI {
            display: none;
        }

        .stat-bar {
            margin: 10px 0;
            background: #e0e0e0;
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
        }

        .stat-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .speed-bar { background: #4CAF50; }
        .stamina-bar { background: #2196F3; }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin: 10px 0;
            width: 100%;
            transition: transform 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        #horsePreview {
            width: 100px;
            height: 100px;
            margin: 10px auto;
            border-radius: 10px;
            border: 2px solid #ddd;
            display: none;
            object-fit: cover;
        }

        #playersList {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-height: 300px;
            overflow-y: auto;
            min-width: 200px;
            display: none;
        }

        .player-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
            padding: 5px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.5);
        }

        .player-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin-right: 10px;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            display: none;
        }

        .loading {
            text-align: center;
            color: #666;
            font-style: italic;
        }

        .horse-label {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            pointer-events: none;
            z-index: 1000;
            transform: translate(-50%, -50%);
        }

        .horse-label img {
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }

        .horse-chat {
            background: rgba(255, 255, 255, 0.95);
            color: black;
            padding: 8px 12px;
            border-radius: 20px;
            margin-bottom: 5px;
            font-size: 14px;
            max-width: 200px;
            word-wrap: break-word;
            display: none;
        }

        .horse-name-container {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 15px;
        }

        #chatInput {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 16px;
            width: 300px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            display: none;
            z-index: 1001;
        }

        #chatButton {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 50%;
            font-size: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            cursor: pointer;
            z-index: 1001;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #chatButton:hover {
            background: rgba(255, 255, 255, 1);
            transform: translateX(-50%) scale(1.1);
        }

        #chatButton.disabled {
            background: rgba(255, 100, 100, 0.95);
            border-color: #ff6666;
        }

        #chatButton.disabled:hover {
            background: rgba(255, 100, 100, 1);
            transform: translateX(-50%) scale(1.1);
        }

        .food-consumed-indicator {
            position: absolute;
            color: #4CAF50;
            font-weight: bold;
            font-size: 18px;
            pointer-events: none;
            z-index: 1500;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            animation: foodEatenFloat 2s ease-out forwards;
        }

        .level-up-indicator {
            position: absolute;
            color: #FFD700;
            font-weight: bold;
            font-size: 24px;
            pointer-events: none;
            z-index: 1600;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            animation: levelUpFloat 3s ease-out forwards;
        }

        .firework {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1550;
        }

        .horse-collection {
            display: none;
            max-height: 400px;
            overflow-y: auto;
            margin: 20px 0;
        }

        .horse-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .horse-item:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .horse-item.selected {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.2);
        }

        .horse-item img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            margin-right: 15px;
            object-fit: cover;
        }

        .horse-stats {
            font-size: 12px;
            color: #666;
        }

        @keyframes foodEatenFloat {
            0% {
                opacity: 1;
                transform: translateY(0px);
            }
            100% {
                opacity: 0;
                transform: translateY(-50px);
            }
        }

        @keyframes levelUpFloat {
            0% {
                opacity: 1;
                transform: translateY(0px) scale(1);
            }
            50% {
                transform: translateY(-30px) scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translateY(-60px) scale(0.8);
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui">
            <div id="horseCreator">
                <h3>🐎 Create Your Steed</h3>
                
                <button id="showCollection" style="margin-bottom: 15px;">🏛️ My Horse Collection</button>
                
                <div id="horseCollection" class="horse-collection">
                    <h4>Select a Horse:</h4>
                    <div id="horseCollectionList"></div>
                    <button id="createNewHorse">Create New Horse</button>
                </div>

                <div id="horseGenerationForm">
                    <div class="form-group">
                        <label for="horsePrompt">Describe your horse:</label>
                        <input type="text" id="horsePrompt" placeholder="e.g., majestic, wild, elegant, powerful..." />
                    </div>
                    
                    <div class="form-group">
                        <label for="horseColor">Primary Color:</label>
                        <select id="horseColor">
                            <option value="brown">Brown</option>
                            <option value="black">Black</option>
                            <option value="white">White</option>
                            <option value="chestnut">Chestnut</option>
                            <option value="gray">Gray</option>
                            <option value="palomino">Palomino</option>
                            <option value="bay">Bay</option>
                            <option value="pinto">Pinto</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="horseType">Horse Type:</label>
                        <select id="horseType">
                            <option value="stallion">Stallion</option>
                            <option value="mare">Mare</option>
                            <option value="mustang">Mustang</option>
                            <option value="thoroughbred">Thoroughbred</option>
                            <option value="arabian">Arabian</option>
                            <option value="clydesdale">Clydesdale</option>
                            <option value="friesian">Friesian</option>
                            <option value="appaloosa">Appaloosa</option>
                        </select>
                    </div>
                    
                    <img id="horsePreview" />
                    <button id="generateHorse">🎨 Generate My Horse</button>
                    <button id="startGame" disabled>🌟 Enter the Field!</button>
                    <div class="loading" id="loadingText" style="display: none;">Crafting your magnificent steed...✨</div>
                </div>
            </div>
            
            <div id="gameUI">
                <h3>Your Horse Stats</h3>
                <div>Speed: <span id="speedValue">0</span></div>
                <div class="stat-bar">
                    <div class="stat-fill speed-bar" id="speedBar" style="width: 0%"></div>
                </div>
                <div>Stamina: <span id="staminaValue">100</span></div>
                <div class="stat-bar">
                    <div class="stat-fill stamina-bar" id="staminaBar" style="width: 100%"></div>
                </div>
                <button id="gallop">Gallop! (Hold)</button>
            </div>
        </div>

        <div id="playersList">
            <h4>Horses in Field</h4>
            <div id="playersContainer"></div>
        </div>

        <div id="controls" style="display: none;">
            <div>Use WASD or Arrow Keys to move your horse</div>
            <div>Hold Gallop button to run faster (uses stamina)</div>
        </div>

        <input type="text" id="chatInput" placeholder="Type to chat..." maxlength="100" />
        <button id="chatButton"></button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
            "three/controls": "https://unpkg.com/three@0.158.0/examples/jsm/controls/OrbitControls.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/controls';

        // Game state
        let scene, camera, renderer, controls;
        let horses = new Map();
        let myHorse = null;
        let myHorseStats = { speed: 50, stamina: 100, maxStamina: 100 };
        let room = null;
        let gameStarted = false;
        let keys = {};
        let isGalloping = false;
        let terrainChunks = new Map();
        let chunkSize = 50;
        let renderDistance = 3; // Number of chunks in each direction
        let horseLabels = new Map();
        let chatInput = null;
        let chatTimeouts = new Map();
        let chatDisabled = false;
        let foodItems = new Map(); // Store food objects by position key
        let consumedFoods = new Set(); // Track consumed foods
        let targetPosition = null; // Target position for click-to-move
        let isMovingToTarget = false; // Whether we're currently moving to a target
        let raycaster = new THREE.Raycaster(); // For click-to-move detection
        let mouse = new THREE.Vector2(); // Mouse coordinates
        let jumpSound = null; // Jump sound effect
        let eatSound = null; // Eating sound effect
        let levelUpSound = null; // Level up sound effect
        let previousStats = null; // Track previous stats for level up detection
        let explorationDistance = 0; // Track distance traveled for exploration XP
        let lastPosition = null; // Last position for distance calculation
        let playerHorses = []; // Collection of player's horses
        let selectedHorseId = null; // Currently selected horse ID
        
        // Cloud system
        let clouds = [];
        let cloudSpeed = 0.005; // How fast clouds move
        let onCloud = false; // Whether player is standing on a cloud
        let currentCloud = null; // Which cloud player is on
        let cloudHeight = 25; // Base height for clouds
        
        // Jump functionality
        let isJumping = false;
        let jumpHeight = 0;
        let jumpStartTime = 0;
        let jumpDuration = 800; // Jump duration in ms
        let maxJumpHeight = 3;
        
        // Flying functionality
        let isFlying = false;
        let flyingHeight = 0;
        let maxFlyingHeight = 50; // Increased from 20 to fly above clouds
        let flySpeed = 0.1;
        let fastFlySpeed = 0.25; // Speed when holding shift
        
        // Double tap detection
        let lastTapTime = 0;
        let lastSpaceTime = 0;
        let doubleTapDelay = 300; // Max time between taps for double tap
        
        // Triple tap detection for flying
        let spacePressTimes = [];
        let tripleTapDelay = 500; // Max time window for triple tap
        
        // Food types with different effects and rarities
        const foodTypes = {
            apple: { color: 0xff0000, stamina: 20, speed: 0, rarity: 0.7, name: "Apple" },
            carrot: { color: 0xff8c00, stamina: 15, speed: 1, rarity: 0.6, name: "Carrot" },
            sugar: { color: 0xffffff, stamina: 30, speed: 2, rarity: 0.2, name: "Sugar Cube" },
            oats: { color: 0xdaa520, stamina: 25, speed: 0, maxStamina: 5, rarity: 0.3, name: "Golden Oats" },
            clover: { color: 0x00ff00, stamina: 10, speed: 0, maxStamina: 2, rarity: 0.5, name: "Lucky Clover" }
        };

        // Cloud types with different properties
        const cloudTypes = {
            normal: { color: 0xffffff, opacity: 0.8, name: "Normal" },
            gray: { color: 0xb0b0b0, opacity: 0.7, name: "Storm Cloud" },
            fluffy: { color: 0xf8f8ff, opacity: 0.9, name: "Fluffy Cloud" },
            rainbow: { 
                colors: [0xff0000, 0xff8000, 0xffff00, 0x00ff00, 0x0080ff, 0x8000ff], 
                opacity: 0.6, 
                name: "Rainbow Cloud" 
            }
        };

        // UI elements
        const horseCreator = document.getElementById('horseCreator');
        const gameUI = document.getElementById('gameUI');
        const horsePrompt = document.getElementById('horsePrompt');
        const horseColor = document.getElementById('horseColor');
        const horseType = document.getElementById('horseType');
        const horsePreview = document.getElementById('horsePreview');
        const generateBtn = document.getElementById('generateHorse');
        const startBtn = document.getElementById('startGame');
        const loadingText = document.getElementById('loadingText');
        const gallopBtn = document.getElementById('gallop');
        const controlsDiv = document.getElementById('controls');
        const playersContainer = document.getElementById('playersContainer');
        chatInput = document.getElementById('chatInput');
        const chatButton = document.getElementById('chatButton');
        const showCollectionBtn = document.getElementById('showCollection');
        const horseCollection = document.getElementById('horseCollection');
        const horseCollectionList = document.getElementById('horseCollectionList');
        const createNewHorseBtn = document.getElementById('createNewHorse');
        const horseGenerationForm = document.getElementById('horseGenerationForm');

        function createHorseSprite(imageUrl) {
            return new Promise((resolve) => {
                const textureLoader = new THREE.TextureLoader();
                const texture = textureLoader.load(
                    imageUrl,
                    () => {
                        // Texture loaded successfully
                        texture.magFilter = THREE.NearestFilter;
                        texture.minFilter = THREE.LinearFilter;
                        
                        const spriteMaterial = new THREE.SpriteMaterial({ 
                            map: texture,
                            transparent: true,
                            alphaTest: 0.1
                        });
                        const sprite = new THREE.Sprite(spriteMaterial);
                        sprite.scale.set(4, 4, 1);
                        sprite.position.y = 4;
                        
                        resolve(sprite);
                    },
                    undefined,
                    (error) => {
                        console.error('Error loading horse texture:', error);
                        // Create a fallback colored sprite
                        const fallbackMaterial = new THREE.SpriteMaterial({ color: 0x8B4513 });
                        const sprite = new THREE.Sprite(fallbackMaterial);
                        sprite.scale.set(4, 4, 1);
                        sprite.position.y = 4;
                        resolve(sprite);
                    }
                );
            });
        }

        function createTree() {
            const group = new THREE.Group();
            
            // Trunk
            const trunkGeometry = new THREE.CylinderGeometry(0.5, 0.8, 4);
            const trunkMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
            const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
            trunk.position.y = 2;
            trunk.castShadow = true;
            group.add(trunk);

            // Leaves
            const leavesGeometry = new THREE.SphereGeometry(3);
            const leavesMaterial = new THREE.MeshLambertMaterial({ color: 0x228B22 });
            const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);
            leaves.position.y = 5;
            leaves.castShadow = true;
            group.add(leaves);

            return group;
        }

        function createFood(type, x, z) {
            const foodData = foodTypes[type];
            const geometry = new THREE.SphereGeometry(0.3);
            const material = new THREE.MeshLambertMaterial({ color: foodData.color });
            const food = new THREE.Mesh(geometry, material);
            food.position.set(x, 0.3, z);
            food.userData = { type, ...foodData };
            return food;
        }

        function createCloud(type = 'normal') {
            const group = new THREE.Group();
            const cloudData = cloudTypes[type];
            
            // Create multiple spheres for a fluffy cloud appearance
            const cloudParts = [];
            const numParts = Math.floor(Math.random() * 5) + 8; // 8-12 parts
            
            for (let i = 0; i < numParts; i++) {
                const geometry = new THREE.SphereGeometry(
                    Math.random() * 2 + 1.5, // Random size 1.5-3.5
                    8, 6 // Lower detail for performance
                );
                
                let material;
                if (type === 'rainbow') {
                    // Rainbow clouds have multiple colored parts
                    const colorIndex = i % cloudData.colors.length;
                    material = new THREE.MeshLambertMaterial({ 
                        color: cloudData.colors[colorIndex],
                        transparent: true,
                        opacity: cloudData.opacity
                    });
                } else {
                    material = new THREE.MeshLambertMaterial({ 
                        color: cloudData.color,
                        transparent: true,
                        opacity: cloudData.opacity
                    });
                }
                
                const sphere = new THREE.Mesh(geometry, material);
                
                // Random positioning within cloud
                sphere.position.set(
                    (Math.random() - 0.5) * 8,
                    (Math.random() - 0.5) * 2,
                    (Math.random() - 0.5) * 8
                );
                
                cloudParts.push(sphere);
                group.add(sphere);
            }
            
            // Add collision bounds for the cloud
            const boundsGeometry = new THREE.BoxGeometry(12, 3, 12);
            const boundsMaterial = new THREE.MeshBasicMaterial({ 
                visible: false // Invisible collision box
            });
            const bounds = new THREE.Mesh(boundsGeometry, boundsMaterial);
            bounds.userData.isCloudBounds = true;
            group.add(bounds);
            
            // Store cloud data
            group.userData = {
                isCloud: true,
                type: type,
                bounds: bounds,
                parts: cloudParts,
                animationOffset: Math.random() * Math.PI * 2,
                moveDirection: new THREE.Vector3(
                    (Math.random() - 0.5) * 2,
                    0,
                    (Math.random() - 0.5) * 2
                ).normalize()
            };
            
            return group;
        }

        function generateFoodInChunk(chunkX, chunkZ) {
            const foods = [];
            const foodCount = Math.floor(Math.random() * 5) + 2; // 2-6 food items per chunk
            
            for (let i = 0; i < foodCount; i++) {
                // Pick random food type based on rarity
                const rand = Math.random();
                let selectedType = 'apple'; // default
                let cumulativeRarity = 0;
                
                for (const [type, data] of Object.entries(foodTypes)) {
                    cumulativeRarity += data.rarity;
                    if (rand <= cumulativeRarity) {
                        selectedType = type;
                        break;
                    }
                }
                
                const x = chunkX * chunkSize + (Math.random() - 0.5) * chunkSize * 0.8;
                const z = chunkZ * chunkSize + (Math.random() - 0.5) * chunkSize * 0.8;
                const posKey = `${Math.floor(x)},${Math.floor(z)}`;
                
                // Don't create food if already consumed
                if (!consumedFoods.has(posKey)) {
                    const food = createFood(selectedType, x, z);
                    foods.push(food);
                    foodItems.set(posKey, food);
                }
            }
            
            return foods;
        }

        function generateClouds() {
            const numClouds = 25; // Increased from 15
            
            for (let i = 0; i < numClouds; i++) {
                // Determine cloud type based on rarity
                let cloudType = 'normal';
                const rand = Math.random();
                
                if (rand < 0.02) { // 2% chance for rainbow clouds
                    cloudType = 'rainbow';
                } else if (rand < 0.15) { // 13% chance for gray clouds
                    cloudType = 'gray';
                } else if (rand < 0.35) { // 20% chance for fluffy clouds
                    cloudType = 'fluffy';
                }
                
                const cloud = createCloud(cloudType);
                
                // Position clouds high in the sky and spread out
                // Vary heights more for different cloud layers
                const baseHeight = cloudHeight + Math.random() * 20; // Between 25-45 units high
                cloud.position.set(
                    (Math.random() - 0.5) * 300, // Increased spread to 300 units
                    baseHeight,
                    (Math.random() - 0.5) * 300
                );
                
                clouds.push(cloud);
                scene.add(cloud);
            }
        }

        function updateClouds() {
            clouds.forEach(cloud => {
                const time = Date.now() * 0.001; // Convert to seconds
                const userData = cloud.userData;
                
                // Move clouds slowly across the sky
                cloud.position.x += userData.moveDirection.x * cloudSpeed;
                cloud.position.z += userData.moveDirection.z * cloudSpeed;
                
                // Animate cloud parts for a floating effect
                userData.parts.forEach((part, index) => {
                    const offset = userData.animationOffset + index * 0.5;
                    part.position.y += Math.sin(time * 0.5 + offset) * 0.01;
                    
                    // Special animation for rainbow clouds
                    if (userData.type === 'rainbow') {
                        // Gentle color shifting effect
                        part.material.opacity = cloudTypes.rainbow.opacity + Math.sin(time * 2 + offset) * 0.1;
                    }
                });
                
                // Wrap clouds around the world (basic culling)
                if (Math.abs(cloud.position.x) > 200 || Math.abs(cloud.position.z) > 200) {
                    cloud.position.x = (Math.random() - 0.5) * 300;
                    cloud.position.z = (Math.random() - 0.5) * 300;
                    
                    // Occasionally regenerate cloud type when wrapping
                    if (Math.random() < 0.1) { // 10% chance to change type
                        const rand = Math.random();
                        let newType = 'normal';
                        
                        if (rand < 0.02) {
                            newType = 'rainbow';
                        } else if (rand < 0.15) {
                            newType = 'gray';
                        } else if (rand < 0.35) {
                            newType = 'fluffy';
                        }
                        
                        if (newType !== userData.type) {
                            // Update cloud appearance
                            const newCloudData = cloudTypes[newType];
                            userData.parts.forEach((part, i) => {
                                if (newType === 'rainbow') {
                                    const colorIndex = i % newCloudData.colors.length;
                                    part.material.color.setHex(newCloudData.colors[colorIndex]);
                                    part.material.opacity = newCloudData.opacity;
                                } else {
                                    part.material.color.setHex(newCloudData.color);
                                    part.material.opacity = newCloudData.opacity;
                                }
                            });
                            userData.type = newType;
                        }
                    }
                }
            });
        }

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 6, 8);

            renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('gameCanvas'),
                antialias: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            generateInitialTerrain();
            generateClouds();

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(50, 50, 50);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enablePan = false;
            controls.enableZoom = false;
            controls.maxPolarAngle = Math.PI / 2.2;
            controls.minDistance = 5;
            controls.maxDistance = 15;
        }

        function generateInitialTerrain() {
            for (let x = -renderDistance; x <= renderDistance; x++) {
                for (let z = -renderDistance; z <= renderDistance; z++) {
                    createTerrainChunk(x, z);
                }
            }
        }

        function createTerrainChunk(chunkX, chunkZ) {
            const chunkKey = `${chunkX},${chunkZ}`;
            if (terrainChunks.has(chunkKey)) return;

            const chunkGroup = new THREE.Group();
            
            // Create field chunk
            const fieldGeometry = new THREE.PlaneGeometry(chunkSize, chunkSize);
            const fieldMaterial = new THREE.MeshLambertMaterial({ color: 0x90EE90 });
            const field = new THREE.Mesh(fieldGeometry, fieldMaterial);
            field.rotation.x = -Math.PI / 2;
            field.position.set(chunkX * chunkSize, 0, chunkZ * chunkSize);
            field.receiveShadow = true;
            chunkGroup.add(field);

            // Add trees to chunk
            const treeCount = Math.floor(Math.random() * 8) + 3;
            for (let i = 0; i < treeCount; i++) {
                const tree = createTree();
                tree.position.set(
                    chunkX * chunkSize + (Math.random() - 0.5) * chunkSize * 0.8,
                    0,
                    chunkZ * chunkSize + (Math.random() - 0.5) * chunkSize * 0.8
                );
                chunkGroup.add(tree);
            }

            // Add food to chunk
            const foods = generateFoodInChunk(chunkX, chunkZ);
            foods.forEach(food => chunkGroup.add(food));

            scene.add(chunkGroup);
            terrainChunks.set(chunkKey, chunkGroup);
        }

        function updateTerrain(playerX, playerZ) {
            const playerChunkX = Math.floor(playerX / chunkSize);
            const playerChunkZ = Math.floor(playerZ / chunkSize);

            // Generate new chunks around player
            for (let x = playerChunkX - renderDistance; x <= playerChunkX + renderDistance; x++) {
                for (let z = playerChunkZ - renderDistance; z <= playerChunkZ + renderDistance; z++) {
                    createTerrainChunk(x, z);
                }
            }

            // Remove distant chunks
            for (let [chunkKey, chunkGroup] of terrainChunks) {
                const [chunkX, chunkZ] = chunkKey.split(',').map(Number);
                const distance = Math.max(Math.abs(chunkX - playerChunkX), Math.abs(chunkZ - playerChunkZ));
                
                if (distance > renderDistance + 1) {
                    scene.remove(chunkGroup);
                    terrainChunks.delete(chunkKey);
                }
            }
        }

        // Multiplayer setup
        async function initMultiplayer() {
            room = new WebsimSocket();
            await room.initialize();

            // Load consumed foods from database
            await loadConsumedFoods();

            room.subscribePresence((currentPresence) => {
                updatePlayersList();
                updateHorsePositions();
            });

            room.onmessage = (event) => {
                const data = event.data;
                switch (data.type) {
                    case "connected":
                        console.log(`${data.username} joined the field!`);
                        break;
                    case "disconnected":
                        console.log(`${data.username} left the field!`);
                        removeHorse(data.clientId);
                        break;
                }
            };
        }

        async function loadConsumedFoods() {
            const consumedRecords = room.collection('consumed_food').getList();
            consumedRecords.forEach(record => {
                consumedFoods.add(record.position);
            });
        }

        async function consumeFood(posKey, foodType) {
            // Remove from scene
            const food = foodItems.get(posKey);
            if (food && food.parent) {
                food.parent.remove(food);
                foodItems.delete(posKey);
                consumedFoods.add(posKey);
                
                // Store in database
                await room.collection('consumed_food').create({
                    position: posKey,
                    foodType: foodType,
                    eatenBy: room.clientId
                });
                
                return true;
            }
            return false;
        }

        function updatePlayersList() {
            playersContainer.innerHTML = '';
            Object.values(room.peers).forEach(peer => {
                const playerDiv = document.createElement('div');
                playerDiv.className = 'player-item';
                playerDiv.innerHTML = `
                    <img src="${peer.avatarUrl}" class="player-avatar" />
                    <span>${peer.username}</span>
                `;
                playersContainer.appendChild(playerDiv);
            });
        }

        function updateHorsePositions() {
            Object.entries(room.presence).forEach(([clientId, presence]) => {
                if (presence.horseImage && clientId !== room.clientId) {
                    updateOrCreateHorse(clientId, presence);
                }
            });
        }

        async function updateOrCreateHorse(clientId, presence) {
            if (!horses.has(clientId)) {
                const horseSprite = await createHorseSprite(presence.horseImage);
                horses.set(clientId, horseSprite);
                scene.add(horseSprite);
                
                // Create label for this horse
                const peer = room.peers[clientId];
                if (peer) {
                    createHorseLabel(clientId, peer.username, peer.avatarUrl);
                }
            }
            
            const horse = horses.get(clientId);
            if (presence.x !== undefined && presence.z !== undefined) {
                horse.position.x = presence.x;
                horse.position.z = presence.z;
            }
            
            // Update jump animation for other players
            if (presence.isJumping && presence.jumpStartTime) {
                const elapsed = Date.now() - presence.jumpStartTime;
                const progress = Math.min(elapsed / jumpDuration, 1);
                const jumpHeight = Math.sin(progress * Math.PI) * maxJumpHeight;
                horse.position.y = 4 + jumpHeight;
            } else if (presence.isFlying && presence.flyingHeight !== undefined) {
                horse.position.y = 4 + presence.flyingHeight;
            } else {
                horse.position.y = 4; // Reset to base height
            }
        }

        function removeHorse(clientId) {
            if (horses.has(clientId)) {
                scene.remove(horses.get(clientId));
                horses.delete(clientId);
            }
            
            // Remove label
            if (horseLabels.has(clientId)) {
                document.body.removeChild(horseLabels.get(clientId));
                horseLabels.delete(clientId);
            }
        }

        function createHorseLabel(clientId, username, avatarUrl) {

                <div class="horse-chat"></div>
                <div class="horse-name-container">
                    <img src="${avatarUrl}" alt="${username}" />
                    <span>${username}</span>
                </div>
            `;
            
            document.body.appendChild(label);
            horseLabels.set(clientId, label);

        function updateHorseLabels() {
            horseLabels.forEach((label, clientId) => {

                if (horse) {
                    // Convert 3D position to screen coordinates

        function setupControls() {
            document.addEventListener('keydown', (e) => {
                // If typing in chat, don't move horse
                if (chatInput && document.activeElement === chatInput) {
                    if (e.code === 'Enter') {
                        sendChatMessage();
                        e.preventDefault();
                    }
                    if (e.code === 'Escape') {
                        hideChatInput();
                        e.preventDefault();
                    }
                    return;
                }

                keys[e.code] = true;
                if (e.code === 'Space') {
                    e.preventDefault();
                    
                    // Check for double tap space
                    const currentTime = Date.now();
                    if (currentTime - lastSpaceTime < doubleTapDelay) {
                        // Double tap detected - jump!
                        startJump();
                    }
                    lastSpaceTime = currentTime;
                    
                    // Track space presses for triple tap detection
                    spacePressTimes.push(currentTime);
                    // Keep only recent presses
                    spacePressTimes = spacePressTimes.filter(time => currentTime - time < tripleTapDelay);
                    
                    // Check for triple tap
                    if (spacePressTimes.length >= 3) {
                        startFlying();
                        spacePressTimes = []; // Reset
                    }
                    
                    if (isFlying) {
                        // Space controls altitude in flying mode
                        // Don't set isGalloping when flying
                    } else {
                        isGalloping = true;
                    }
                }
            });
            document.addEventListener('keyup', (e) => {
                keys[e.code] = false;
                if (e.code === 'Space') {
                    if (!isFlying) {
                        isGalloping = false;
                    }
                }
            });

            gallopBtn.addEventListener('mousedown', () => {
                isGalloping = true;
            });

            gallopBtn.addEventListener('mouseup', () => {
                isGalloping = false;
            });

            gallopBtn.addEventListener('mouseleave', () => {
                isGalloping = false;
            });

            // Chat button functionality
            chatButton.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!chatDisabled) {
                    showChatInput();
                }
            });

            // Right-click and long-tap to toggle chat disable
            let longTapTimer = null;
            
            chatButton.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                toggleChatDisabled();
            });

            chatButton.addEventListener('touchstart', (e) => {
                longTapTimer = setTimeout(() => {
                    toggleChatDisabled();
                }, 500);
            });

            chatButton.addEventListener('touchend', (e) => {
                if (longTapTimer) {
                    clearTimeout(longTapTimer);
                    longTapTimer = null;
                }
            });

            chatButton.addEventListener('touchcancel', (e) => {
                if (longTapTimer) {
                    clearTimeout(longTapTimer);
                    longTapTimer = null;
                }
            });

            // Hide chat when clicking outside
            document.addEventListener('click', (e) => {
                if (chatInput.style.display === 'block' && 
                    !chatInput.contains(e.target) && 
                    !chatButton.contains(e.target)) {
                    hideChatInput();
                }
            });

            chatInput.addEventListener('blur', () => {
                // Small delay to allow for other click events to process
                setTimeout(() => {
                    if (document.activeElement !== chatInput) {
                        hideChatInput();
                    }
                }, 100);
            });

            // Click/tap to move functionality
            renderer.domElement.addEventListener('click', onCanvasClick);
            renderer.domElement.addEventListener('touchend', onCanvasTouch);
            
            // Double tap to jump on mobile
            renderer.domElement.addEventListener('touchstart', onCanvasTouchStart);
        }
        
        function onCanvasTouchStart(event) {
            const currentTime = Date.now();
            if (currentTime - lastTapTime < doubleTapDelay) {
                // Double tap detected - jump!
                startJump();
                event.preventDefault();
            }
            lastTapTime = currentTime;
        }
        
        function startJump() {
            if (!myHorse || !gameStarted || isJumping || isFlying) return;
            
            // Play jump sound
            if (jumpSound) {
                jumpSound.currentTime = 0;
                jumpSound.play().catch(e => console.log('Sound play failed:', e));
            }
            
            isJumping = true;
            jumpStartTime = Date.now();
            jumpHeight = 0;
            
            // Update multiplayer presence
            room.updatePresence({
                isJumping: true,
                jumpStartTime: jumpStartTime
            });
        }

        function startFlying() {
            if (!myHorse || !gameStarted) return;
            
            isFlying = true;
            isJumping = false; // Cancel jump if jumping
            flyingHeight = myHorse.position.y - 4; // Current height above ground
            
            // Update multiplayer presence
            room.updatePresence({
                isFlying: true,
                isJumping: false,
                jumpStartTime: null
            });
        }

        function stopFlying() {
            isFlying = false;
            flyingHeight = 0;
            myHorse.position.y = 4; // Reset to ground level
            
            // Update multiplayer presence
            room.updatePresence({
                isFlying: false
            });
        }
        
        function onCanvasClick(event) {
            if (!myHorse || !gameStarted) return;
            
            // Don't move if clicking on UI elements
            if (event.target !== renderer.domElement) return;
            
            // Calculate mouse position in normalized device coordinates
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            
            // Check if clicking on food first
            raycaster.setFromCamera(mouse, camera);
            const allFoodObjects = Array.from(foodItems.values());
            const foodIntersects = raycaster.intersectObjects(allFoodObjects);
            
            if (foodIntersects.length > 0) {
                // Clicked on food - eat it!
                const clickedFood = foodIntersects[0].object;
                eatFoodByClick(clickedFood);
                return;
            }
            
            // Check if clicking on horse 
            const horseIntersects = raycaster.intersectObject(myHorse);
            
            if (horseIntersects.length > 0) {
                // Clicked on horse
                if (isJumping) {
                    // Horse is jumping - start flying!
                    startFlying();
                } else {
                    // Horse on ground - jump!
                    startJump();
                }
                return;
            }
            
            setMoveTarget();
        }

        function onCanvasTouch(event) {
            if (!myHorse || !gameStarted) return;
            if (event.touches.length > 0 || event.changedTouches.length === 0) return;
            
            event.preventDefault();
            
            const touch = event.changedTouches[0];
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((touch.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((touch.clientY - rect.top) / rect.height) * 2 + 1;
            
            // Check if touching food first
            raycaster.setFromCamera(mouse, camera);
            const allFoodObjects = Array.from(foodItems.values());
            const foodIntersects = raycaster.intersectObjects(allFoodObjects);
            
            if (foodIntersects.length > 0) {
                // Touched food - eat it!
                const touchedFood = foodIntersects[0].object;
                eatFoodByClick(touchedFood);
                return;
            }
            
            // Check if touching horse
            const horseIntersects = raycaster.intersectObject(myHorse);
            
            if (horseIntersects.length > 0) {
                // Touched horse
                if (isJumping) {
                    // Horse is jumping - start flying!
                    startFlying();
                } else {
                    // Horse on ground - jump!
                    startJump();
                }
                return;
            }
            
            setMoveTarget();
        }

        function eatFoodByClick(foodObject) {
            // Find the position key for this food object
            let posKey = null;
            for (const [key, food] of foodItems.entries()) {
                if (food === foodObject) {
                    posKey = key;
                    break;
                }
            }
            
            if (!posKey) return;
            
            const foodData = foodObject.userData;
            
            // Play eating sound
            if (eatSound) {
                eatSound.currentTime = 0;
                eatSound.play().catch(e => console.log('Eat sound play failed:', e));
            }
            
            // Eating animation - scale down the food
            const originalScale = foodObject.scale.clone();
            const shrinkDuration = 300; // ms
            const startTime = Date.now();
            
            function animateEat() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / shrinkDuration, 1);
                
                // Scale down with ease-out
                const scale = 1 - (progress * progress);
                foodObject.scale.setScalar(scale);
                
                if (progress < 1) {
                    requestAnimationFrame(animateEat);
                } else {
                    // Animation finished - consume the food
                    applyFoodEffects(foodData);
                    consumeFood(posKey, foodData.type);
                    showFoodConsumedIndicator(foodData.name, myHorse.position);
                }
            }
            
            animateEat();
        }
        
        function applyFoodEffects(foodData) {
            // Store previous stats for level up detection
            const oldStats = { ...myHorseStats };
            
            // Apply food effects
            myHorseStats.stamina = Math.min(myHorseStats.maxStamina, 
                myHorseStats.stamina + foodData.stamina);
            
            if (foodData.speed) {
                myHorseStats.speed += foodData.speed;
            }
            
            if (foodData.maxStamina) {
                myHorseStats.maxStamina += foodData.maxStamina;
                myHorseStats.stamina = Math.min(myHorseStats.maxStamina, myHorseStats.stamina);
            }
            
            // Check for level ups
            checkForLevelUp(oldStats, myHorseStats);
            
            // Update UI and presence
            updateStatsUI();
            savePlayerData();
            room.updatePresence({
                stats: myHorseStats,
                stamina: myHorseStats.stamina
            });
        }

        function checkForLevelUp(oldStats, newStats) {
            let leveledUp = false;
            let levelUpMessage = "";
            
            if (newStats.speed > oldStats.speed) {
                leveledUp = true;
                levelUpMessage += `Speed +${newStats.speed - oldStats.speed}! `;
            }
            
            if (newStats.maxStamina > oldStats.maxStamina) {
                leveledUp = true;
                levelUpMessage += `Max Stamina +${newStats.maxStamina - oldStats.maxStamina}! `;
            }
            
            if (leveledUp) {
                playLevelUpEffect(levelUpMessage.trim());
            }
        }

        function playLevelUpEffect(message) {
            // Play level up sound
            if (levelUpSound) {
                levelUpSound.currentTime = 0;
                levelUpSound.play().catch(e => console.log('Level up sound play failed:', e));
            }
            
            // Show level up indicator
            showLevelUpIndicator(message, myHorse.position);
            
            // Create fireworks
            createFireworks(myHorse.position);
        }

        function showLevelUpIndicator(message, position) {
            const indicator = document.createElement('div');
            indicator.className = 'level-up-indicator';
            indicator.textContent = `LEVEL UP! ${message}`;
            
            // Convert 3D position to screen coordinates
            const vector = new THREE.Vector3();
            vector.setFromMatrixPosition(myHorse.matrixWorld);
            vector.y += 3;
            vector.project(camera);
            
            const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
            const y = (vector.y * -0.5 + 0.5) * window.innerHeight;
            
            indicator.style.left = x + 'px';
            indicator.style.top = y + 'px';
            
            document.body.appendChild(indicator);
            
            // Remove after animation
            setTimeout(() => {
                if (indicator.parentNode) {
                    document.body.removeChild(indicator);
                }
            }, 3000);
        }

        function createFireworks(position) {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ffa500'];
            const numFireworks = 15;
            
            for (let i = 0; i < numFireworks; i++) {
                setTimeout(() => {
                    const firework = document.createElement('div');
                    firework.className = 'firework';
                    firework.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    
                    // Convert horse position to screen coordinates
                    const vector = new THREE.Vector3();
                    vector.setFromMatrixPosition(myHorse.matrixWorld);
                    vector.y += 2;
                    vector.project(camera);
                    
                    const startX = (vector.x * 0.5 + 0.5) * window.innerWidth;
                    const startY = (vector.y * -0.5 + 0.5) * window.innerHeight;
                    
                    firework.style.left = startX + 'px';
                    firework.style.top = startY + 'px';
                    
                    document.body.appendChild(firework);
                    
                    // Animate firework
                    const angle = (Math.PI * 2 * i) / numFireworks;
                    const distance = 100 + Math.random() * 100;
                    const endX = startX + Math.cos(angle) * distance;
                    const endY = startY + Math.sin(angle) * distance;
                    
                    const animation = firework.animate([
                        { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                        { transform: `translate(${endX - startX}px, ${endY - startY}px) scale(0.2)`, opacity: 0 }
                    ], {
                        duration: 800 + Math.random() * 400,
                        easing: 'ease-out'
                    });
                    
                    animation.onfinish = () => {
                        if (firework.parentNode) {
                            document.body.removeChild(firework);
                        }
                    };
                }, i * 50);
            }
        }

        function savePlayerData() {
            // Save to localStorage
            const playerData = {
                horses: playerHorses,
                currentHorse: {
                    id: selectedHorseId,
                    stats: myHorseStats,
                    explorationDistance: explorationDistance
                }
            };
            localStorage.setItem('paperHorseData', JSON.stringify(playerData));
            
            // Save to database
            if (room && selectedHorseId) {
                room.collection('horse_data').create({
                    horseId: selectedHorseId,
                    stats: myHorseStats,
                    explorationDistance: explorationDistance,
                    lastPlayed: Date.now()
                });
            }
        }

        function loadPlayerData() {
            // Load from localStorage
            const saved = localStorage.getItem('paperHorseData');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    playerHorses = data.horses || [];
                    if (data.currentHorse) {
                        selectedHorseId = data.currentHorse.id;
                        myHorseStats = data.currentHorse.stats || { speed: 50, stamina: 100, maxStamina: 100 };
                        explorationDistance = data.currentHorse.explorationDistance || 0;
                    }
                } catch (e) {
                    console.error('Error loading player data:', e);
                }
            }
        }

        async function loadHorseCollection() {
            loadPlayerData();
            
            // Also load from database
            if (room) {
                const horseRecords = room.collection('horse_collection').getList();
                horseRecords.forEach(record => {
                    const existingIndex = playerHorses.findIndex(h => h.id === record.horseId);
                    if (existingIndex >= 0) {
                        // Update existing horse
                        playerHorses[existingIndex] = { ...playerHorses[existingIndex], ...record };
                    } else {
                        // Add new horse
                        playerHorses.push(record);
                    }
                });
            }
            
            updateHorseCollectionUI();
        }

        function updateHorseCollectionUI() {
            horseCollectionList.innerHTML = '';
            
            playerHorses.forEach(horse => {
                const horseItem = document.createElement('div');
                horseItem.className = 'horse-item';
                if (horse.id === selectedHorseId) {
                    horseItem.classList.add('selected');
                }
                
                horseItem.innerHTML = `
                    <img src="${horse.image}" alt="${horse.name}" />
                    <div>
                        <h4>${horse.name}</h4>
                        <div class="horse-stats">
                            Speed: ${horse.stats?.speed || 50} | 
                            Max Stamina: ${horse.stats?.maxStamina || 100} |
                            Explored: ${Math.floor((horse.explorationDistance || 0) / 100)}km
                        </div>
                        <div style="font-size: 11px; color: #999;">
                            ${horse.prompt}
                        </div>
                    </div>
                `;
                
                horseItem.addEventListener('click', () => {
                    selectHorse(horse.id);
                });
                
                horseCollectionList.appendChild(horseItem);
            });
        }

        function selectHorse(horseId) {
            const horse = playerHorses.find(h => h.id === horseId);
            if (!horse) return;
            
            selectedHorseId = horseId;
            myHorseStats = horse.stats || { speed: 50, stamina: 100, maxStamina: 100 };
            explorationDistance = horse.explorationDistance || 0;
            
            // Update UI
            horsePreview.src = horse.image;
            horsePreview.style.display = 'block';
            startBtn.disabled = false;
            
            // Store horse data
            window.myHorseData = {
                image: horse.image,
                stats: { ...myHorseStats }
            };
            
            updateHorseCollectionUI();
            savePlayerData();
            startGame();
        }

        async function startGame() {
            if (!window.myHorseData) return;

            horseCreator.style.display = 'none';
            gameUI.style.display = 'none';
            controlsDiv.style.display = 'none';
            document.getElementById('ui').style.display = 'none';
            gameStarted = true;

            // Create my horse sprite and wait for it to load
            myHorse = await createHorseSprite(window.myHorseData.image);
            myHorse.position.set(0, 4, 0);
            scene.add(myHorse);

            // Update multiplayer with horse data
            room.updatePresence({
                horseImage: window.myHorseData.image,
                stats: window.myHorseData.stats,
                x: 0,
                z: 0,
                stamina: myHorseStats.stamina
            });

            updateStatsUI();
            
            // Create label for my horse
            const currentUser = room.peers[room.clientId];
            if (currentUser) {
                createHorseLabel(room.clientId, currentUser.username, currentUser.avatarUrl);
            }
        }

        // Game loop
        function animate() {
            requestAnimationFrame(animate);
            
            updateMovement();
            updateClouds();
            updateHorseLabels();
            controls.update();
            renderer.render(scene, camera);
        }

        // Event listeners
        generateBtn.addEventListener('click', generateHorse);
        startBtn.addEventListener('click', startGame);
        
        showCollectionBtn.addEventListener('click', () => {
            if (horseCollection.style.display === 'none' || !horseCollection.style.display) {
                horseCollection.style.display = 'block';
                horseGenerationForm.style.display = 'none';
                showCollectionBtn.textContent = '🎨 Create New Horse';
            } else {
                horseCollection.style.display = 'none';
                horseGenerationForm.style.display = 'block';
                showCollectionBtn.textContent = '🏛️ My Horse Collection';
            }
        });

        createNewHorseBtn.addEventListener('click', () => {
            horseCollection.style.display = 'none';
            horseGenerationForm.style.display = 'block';
            showCollectionBtn.textContent = '🏛️ My Horse Collection';
        });
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize game
        async function init() {
            initScene();
            await initMultiplayer();
            setupControls();
            
            // Load level up sound
            levelUpSound = new Audio('levelup.mp3');
            levelUpSound.volume = 0.5;
            
            // Load jump sound
            jumpSound = new Audio('jump.mp3');
            jumpSound.volume = 0.3;
            
            // Create eating sound effect
            eatSound = new Audio('eat.mp3');
            eatSound.volume = 0.4;
            
            // Load horse collection
            await loadHorseCollection();
            
            animate();
        }

        init();
    </script>
