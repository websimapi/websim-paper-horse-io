<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Horse-io</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #87CEEB, #98FB98);
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            max-width: 400px;
            width: 90vw;
            text-align: center;
        }

        #horseCreator {
            display: block;
        }

        #horseCreator h3 {
            margin-top: 0;
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .form-group {
            margin: 15px 0;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        #horsePrompt {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            margin: 10px 0;
        }

        #gameUI {
            display: none;
        }

        .stat-bar {
            margin: 10px 0;
            background: #e0e0e0;
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
        }

        .stat-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .speed-bar { background: #4CAF50; }
        .stamina-bar { background: #2196F3; }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin: 10px 0;
            width: 100%;
            transition: transform 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        #horsePreview {
            width: 100px;
            height: 100px;
            margin: 10px auto;
            border-radius: 10px;
            border: 2px solid #ddd;
            display: none;
            object-fit: cover;
        }

        #playersList {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-height: 300px;
            overflow-y: auto;
            min-width: 200px;
            display: none;
        }

        .player-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
            padding: 5px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.5);
        }

        .player-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin-right: 10px;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            display: none;
        }

        .loading {
            text-align: center;
            color: #666;
            font-style: italic;
        }

        .horse-label {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            pointer-events: none;
            z-index: 1000;
            transform: translate(-50%, -50%);
        }

        .horse-label img {
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }

        .horse-chat {
            background: rgba(255, 255, 255, 0.95);
            color: black;
            padding: 8px 12px;
            border-radius: 20px;
            margin-bottom: 5px;
            font-size: 14px;
            max-width: 200px;
            word-wrap: break-word;
            display: none;
        }

        .horse-name-container {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 15px;
        }

        #chatInput {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 16px;
            width: 300px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            display: none;
            z-index: 1001;
        }

        #chatButton {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 50%;
            font-size: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            cursor: pointer;
            z-index: 1001;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #chatButton:hover {
            background: rgba(255, 255, 255, 1);
            transform: translateX(-50%) scale(1.1);
        }

        #chatButton.disabled {
            background: rgba(255, 100, 100, 0.95);
            border-color: #ff6666;
        }

        #chatButton.disabled:hover {
            background: rgba(255, 100, 100, 1);
            transform: translateX(-50%) scale(1.1);
        }

        #notificationArea {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .notification {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            font-size: 1em;
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .notification.show {
            opacity: 1;
            transform: translateY(0);
        }

        #statsDisplay {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.9);
            padding: 15px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            display: none;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui">
            <div id="horseCreator">
                <h3>🐎 Create Your Steed</h3>
                
                <div class="form-group">
                    <label for="horsePrompt">Describe your horse:</label>
                    <input type="text" id="horsePrompt" placeholder="e.g., majestic, wild, elegant, powerful..." />
                </div>
                
                <div class="form-group">
                    <label for="horseColor">Primary Color:</label>
                    <select id="horseColor">
                        <option value="brown">Brown</option>
                        <option value="black">Black</option>
                        <option value="white">White</option>
                        <option value="chestnut">Chestnut</option>
                        <option value="gray">Gray</option>
                        <option value="palomino">Palomino</option>
                        <option value="bay">Bay</option>
                        <option value="pinto">Pinto</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="horseType">Horse Type:</label>
                    <select id="horseType">
                        <option value="stallion">Stallion</option>
                        <option value="mare">Mare</option>
                        <option value="mustang">Mustang</option>
                        <option value="thoroughbred">Thoroughbred</option>
                        <option value="arabian">Arabian</option>
                        <option value="clydesdale">Clydesdale</option>
                        <option value="friesian">Friesian</option>
                        <option value="appaloosa">Appaloosa</option>
                    </select>
                </div>
                
                <img id="horsePreview" />
                <button id="generateHorse">🎨 Generate My Horse</button>
                <button id="startGame" disabled>🏁 Enter the Field!</button>
                <div class="loading" id="loadingText" style="display: none;">Crafting your magnificent steed... 🎨</div>
            </div>
            
            <div id="gameUI"> 
                <h3>Your Horse Stats</h3>
                <div>Speed: <span id="speedValue">0</span></div>
                <div class="stat-bar">
                    <div class="stat-fill speed-bar" id="speedBar" style="width: 0%"></div>
                </div>
                <div>Stamina: <span id="staminaValue">100</span></div>
                <div class="stat-bar">
                    <div class="stat-fill stamina-bar" id="staminaBar" style="width: 100%"></div>
                </div>
                <button id="gallop">Gallop! (Hold)</button>
            </div>
        </div>

        <div id="playersList">
            <h4>Horses in Field</h4>
            <div id="playersContainer"></div>
        </div>

        <div id="controls" style="display: none;">
            <div>Use WASD or Arrow Keys to move your horse</div>
            <div>Hold Gallop button or Spacebar to run faster (uses stamina)</div>
        </div>
        
        <div id="statsDisplay" style="display: none;">
            <h3>Your Horse</h3>
            <div>Speed: <span id="currentSpeedDisplay">0</span></div>
            <div class="stat-bar"><div class="stat-fill speed-bar" id="currentSpeedBar" style="width: 0%;"></div></div>
            <div>Stamina: <span id="currentStaminaDisplay">100</span> / <span id="maxStaminaDisplay">100</span></div>
            <div class="stat-bar"><div class="stat-fill stamina-bar" id="currentStaminaBar" style="width: 100%;"></div></div>
        </div>

        <input type="text" id="chatInput" placeholder="Type to chat..." maxlength="100" />
        <button id="chatButton">💬</button>
        <div id="notificationArea"></div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
            "three/controls": "https://unpkg.com/three@0.158.0/examples/jsm/controls/OrbitControls.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/controls';

        // Game state
        let scene, camera, renderer, controls;
        let horses = new Map();
        let myHorse = null;
        let myHorseStats = { speed: 50, stamina: 100, maxStamina: 100 }; 
        let room = null;
        let gameStarted = false;
        let keys = {};
        let isGalloping = false;
        let terrainChunks = new Map();
        let chunkSize = 50;
        let renderDistance = 2; 
        let horseLabels = new Map();
        let chatInput = null;
        let chatTimeouts = new Map();
        let chatDisabled = false;

        const FOOD_COLLECTION_TYPE = 'food_item_v2';
        const PLAYER_HORSE_COLLECTION_TYPE = 'player_horse_v1';
        let foodMeshes = new Map(); 
        let processedFoodChunks = new Set(); 

        const FOOD_TYPES = {
            APPLE: {
                type: "apple",
                color: 0xff0000, 
                geometryFactory: () => new THREE.SphereGeometry(0.3, 8, 8),
                staminaBoost: 25,
                permanentBoost: null,
                spawnChance: 0.7, 
                yOffset: 0.15
            },
            GOLDEN_CARROT: {
                type: "golden_carrot",
                color: 0xFFD700, 
                geometryFactory: () => new THREE.ConeGeometry(0.2, 0.8, 8), 
                staminaBoost: 10,
                permanentBoost: { stat: "speed", value: 2 }, 
                spawnChance: 0.3, 
                yOffset: 0.4
            }
        };

        const uiContainer = document.getElementById('ui');
        const horseCreatorUI = document.getElementById('horseCreator');
        const horsePrompt = document.getElementById('horsePrompt');
        const horseColor = document.getElementById('horseColor');
        const horseType = document.getElementById('horseType');
        const horsePreview = document.getElementById('horsePreview');
        const generateBtn = document.getElementById('generateHorse');
        const startBtn = document.getElementById('startGame');
        const loadingText = document.getElementById('loadingText');
        const controlsDiv = document.getElementById('controls');
        const playersListDiv = document.getElementById('playersList');
        const playersContainer = document.getElementById('playersContainer');
        const statsDisplayDiv = document.getElementById('statsDisplay');
        chatInput = document.getElementById('chatInput');
        const chatButton = document.getElementById('chatButton');
        const notificationArea = document.getElementById('notificationArea');

        function createHorseSprite(imageUrl) {
            return new Promise((resolve) => {
                const textureLoader = new THREE.TextureLoader();
                const texture = textureLoader.load(
                    imageUrl,
                    () => {
                        texture.magFilter = THREE.NearestFilter;
                        texture.minFilter = THREE.LinearFilter;
                        
                        const spriteMaterial = new THREE.SpriteMaterial({ 
                            map: texture,
                            transparent: true,
                            alphaTest: 0.1 
                        });
                        const sprite = new THREE.Sprite(spriteMaterial);
                        sprite.scale.set(4, 4, 1); 
                        sprite.position.y = 2; 
                        
                        resolve(sprite);
                    },
                    undefined,
                    (error) => {
                        console.error('Error loading horse texture:', error);
                        const fallbackMaterial = new THREE.SpriteMaterial({ color: 0x8B4513 });
                        const sprite = new THREE.Sprite(fallbackMaterial);
                        sprite.scale.set(4, 4, 1);
                        sprite.position.y = 2;
                        resolve(sprite);
                    }
                );
            });
        }

        function createTree() {
            const group = new THREE.Group();
            const trunkGeometry = new THREE.CylinderGeometry(0.5, 0.8, 4);
            const trunkMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
            const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
            trunk.position.y = 2;
            trunk.castShadow = true;
            group.add(trunk);

            const leavesGeometry = new THREE.SphereGeometry(3);
            const leavesMaterial = new THREE.MeshLambertMaterial({ color: 0x228B22 });
            const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);
            leaves.position.y = 5;
            leaves.castShadow = true;
            group.add(leaves);
            return group;
        }

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 7); 

            renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('gameCanvas'),
                antialias: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            generateInitialTerrain();

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7); 
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(50, 50, 50);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enablePan = false;
            controls.maxPolarAngle = Math.PI / 2.1; 
            controls.minDistance = 3; 
            controls.maxDistance = 20; 
        }

        function generateInitialTerrain() {
            const initialPlayerChunkX = 0;
            const initialPlayerChunkZ = 0;
            for (let x = initialPlayerChunkX - renderDistance; x <= initialPlayerChunkX + renderDistance; x++) {
                for (let z = initialPlayerChunkZ - renderDistance; z <= initialPlayerChunkZ + renderDistance; z++) {
                    createTerrainChunk(x, z);
                }
            }
        }

        function createTerrainChunk(chunkX, chunkZ) {
            const chunkKey = `${chunkX},${chunkZ}`;
            if (terrainChunks.has(chunkKey)) return;

            const chunkGroup = new THREE.Group();
            
            const fieldGeometry = new THREE.PlaneGeometry(chunkSize, chunkSize);
            const fieldMaterial = new THREE.MeshLambertMaterial({ color: 0x90EE90 });
            const field = new THREE.Mesh(fieldGeometry, fieldMaterial);
            field.rotation.x = -Math.PI / 2;
            field.position.set(chunkX * chunkSize, 0, chunkZ * chunkSize);
            field.receiveShadow = true;
            chunkGroup.add(field);

            const treeCount = Math.floor(Math.random() * 5) + 2; 
            for (let i = 0; i < treeCount; i++) {
                const tree = createTree();
                tree.position.set(
                    chunkX * chunkSize + (Math.random() - 0.5) * chunkSize * 0.9, 
                    0,
                    chunkZ * chunkSize + (Math.random() - 0.5) * chunkSize * 0.9
                );
                chunkGroup.add(tree);
            }

            scene.add(chunkGroup);
            terrainChunks.set(chunkKey, chunkGroup);

            if (room && room.clientId) { 
                 if (!processedFoodChunks.has(chunkKey)) {
                    processedFoodChunks.add(chunkKey); 
                    spawnFoodForChunk(chunkX, chunkZ, chunkKey);
                }
            }
        }
        
        async function spawnFoodForChunk(chunkX, chunkZ, chunkKey) {
            await new Promise(resolve => setTimeout(resolve, Math.random() * 1000 + 500));

            const existingFoodInChunk = room.collection(FOOD_COLLECTION_TYPE).filter({ chunkKey: chunkKey }).getList();
            if (existingFoodInChunk.length > 0) {
                return;
            }
            
            console.log(`Attempting to spawn food for new chunk: ${chunkKey}`);
            const numItemsToSpawn = 1 + Math.floor(Math.random() * 3); 
            for (let i = 0; i < numItemsToSpawn; i++) {
                const rand = Math.random();
                let chosenFoodKey = 'APPLE'; 
                if (rand < FOOD_TYPES.GOLDEN_CARROT.spawnChance) { 
                    chosenFoodKey = 'GOLDEN_CARROT';
                }

                const foodDetails = FOOD_TYPES[chosenFoodKey];
                
                const foodRecord = {
                    type: foodDetails.type,
                    x: chunkX * chunkSize + (Math.random() - 0.5) * chunkSize * 0.9,
                    y: foodDetails.yOffset, 
                    z: chunkZ * chunkSize + (Math.random() - 0.5) * chunkSize * 0.9,
                    isEaten: false,
                    eatenBy: null,
                    statBoostType: foodDetails.permanentBoost ? foodDetails.permanentBoost.stat : null,
                    statBoostValue: foodDetails.permanentBoost ? foodDetails.permanentBoost.value : null,
                    staminaBoost: foodDetails.staminaBoost,
                    chunkKey: chunkKey,
                };
                try {
                    await room.collection(FOOD_COLLECTION_TYPE).create(foodRecord);
                } catch (error) {
                    console.error("Error creating food item in DB:", error);
                }
            }
        }

        function updateTerrain(playerX, playerZ) {
            const playerChunkX = Math.floor(playerX / chunkSize);
            const playerChunkZ = Math.floor(playerZ / chunkSize);

            for (let x = playerChunkX - renderDistance; x <= playerChunkX + renderDistance; x++) {
                for (let z = playerChunkZ - renderDistance; z <= playerChunkZ + renderDistance; z++) {
                    createTerrainChunk(x, z);
                }
            }

            for (let [chunkKey, chunkGroup] of terrainChunks) {
                const [loadedChunkX, loadedChunkZ] = chunkKey.split(',').map(Number);
                const distance = Math.max(Math.abs(loadedChunkX - playerChunkX), Math.abs(loadedChunkZ - playerChunkZ));
                
                if (distance > renderDistance + 1) { 
                    scene.remove(chunkGroup);
                    terrainChunks.delete(chunkKey);
                    foodMeshes.forEach((mesh, foodId) => {
                        const foodData = room.collection(FOOD_COLLECTION_TYPE).getList().find(f => f.id === foodId);
                        if (foodData && foodData.chunkKey === chunkKey) {
                            scene.remove(mesh);
                            foodMeshes.delete(foodId);
                        }
                    });
                }
            }
            if (room) updateFoodVisuals(room.collection(FOOD_COLLECTION_TYPE).getList());
        }

        async function initMultiplayer() {
            room = new WebsimSocket();
            room.subscribePresence((currentPresence) => {
                updatePlayersList(); 
                updateHorsePositions(); 
            });
            
            room.collection(FOOD_COLLECTION_TYPE).subscribe(updateFoodVisuals);

            await loadMyHorseDataFromDB();

            room.onmessage = (event) => {
                const data = event.data;
                switch (data.type) {
                    case "connected":
                        console.log(`${data.username} joined the field!`);
                        break;
                    case "disconnected":
                        console.log(`${data.username} left the field!`);
                        removeHorse(data.clientId);
                        break;
                }
            };
        }
        
        async function loadMyHorseDataFromDB() {
            if (!room || !room.clientId) {
                console.log("Room not ready for loading horse data.");
                return;
            }
            const playerHorseRecords = room.collection(PLAYER_HORSE_COLLECTION_TYPE).filter({ clientId: room.clientId }).getList();
            
            if (playerHorseRecords.length === 0) {
                await new Promise(resolve => setTimeout(resolve, 1000)); 
                const updatedRecords = room.collection(PLAYER_HORSE_COLLECTION_TYPE).filter({ clientId: room.clientId }).getList();
                if (updatedRecords.length > 0) {
                    Object.assign(myHorseStats, updatedRecords[0].stats); 
                    window.myHorseData = { ...updatedRecords[0] }; 
                    console.log("Loaded existing horse data:", window.myHorseData);

                    horsePreview.src = window.myHorseData.image;
                    horsePreview.style.display = 'block';
                    startBtn.disabled = false;
                    horsePrompt.value = "My returning steed"; 
                } else {
                    console.log("No existing horse data found for this player.");
                }
            } else {
                Object.assign(myHorseStats, playerHorseRecords[0].stats);
                window.myHorseData = { ...playerHorseRecords[0] };
                console.log("Loaded existing horse data (fast):", window.myHorseData);
                horsePreview.src = window.myHorseData.image;
                horsePreview.style.display = 'block';
                startBtn.disabled = false;
                horsePrompt.value = "My returning steed";
            }
        }

        function updatePlayersList() {
            if (!room || !room.peers) return;
            playersContainer.innerHTML = '';
            Object.values(room.peers).forEach(peer => {
                if (!peer || !peer.avatarUrl || !peer.username) return; 
                const playerDiv = document.createElement('div');
                playerDiv.className = 'player-item';
                playerDiv.innerHTML = `
                    <img src="${peer.avatarUrl}" class="player-avatar" />
                    <span>${peer.username}</span>
                `;
                playersContainer.appendChild(playerDiv);
            });
        }

        function updateHorsePositions() {
            if (!room || !room.presence) return;
            Object.entries(room.presence).forEach(([clientId, presence]) => {
                if (presence && presence.horseImage && clientId !== room.clientId) {
                    updateOrCreateHorse(clientId, presence);
                }
            });
        }

        async function updateOrCreateHorse(clientId, presence) {
            if (!horses.has(clientId)) {
                const horseSprite = await createHorseSprite(presence.horseImage);
                horses.set(clientId, horseSprite);
                scene.add(horseSprite);
                
                const peer = room.peers[clientId];
                if (peer) {
                    createHorseLabel(clientId, peer.username, peer.avatarUrl);
                }
            }
            
            const horse = horses.get(clientId);
            if (horse && presence.x !== undefined && presence.z !== undefined) {
                horse.position.x = presence.x;
                horse.position.z = presence.z;
            }
        }

        function removeHorse(clientId) {
            if (horses.has(clientId)) {
                scene.remove(horses.get(clientId));
                horses.delete(clientId);
            }
            if (horseLabels.has(clientId)) {
                const labelElement = horseLabels.get(clientId);
                if (labelElement && labelElement.parentNode) {
                    labelElement.parentNode.removeChild(labelElement);
                }
                horseLabels.delete(clientId);
            }
        }

        function setupControls() {
            document.addEventListener('keydown', (e) => {
                if (chatInput && document.activeElement === chatInput) {
                    if (e.code === 'Enter') { sendChatMessage(); e.preventDefault(); }
                    if (e.code === 'Escape') { hideChatInput(); e.preventDefault(); }
                    return;
                }
                keys[e.code] = true;
                if (e.code === 'Space' && gameStarted) { e.preventDefault(); isGalloping = true; }
            });
            document.addEventListener('keyup', (e) => {
                keys[e.code] = false;
                if (e.code === 'Space') { isGalloping = false; }
            });

            chatButton.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!chatDisabled) { showChatInput(); }
            });

            let longTapTimer = null;
            chatButton.addEventListener('contextmenu', (e) => { e.preventDefault(); toggleChatDisabled(); });
            chatButton.addEventListener('touchstart', (e) => {
                longTapTimer = setTimeout(() => { toggleChatDisabled(); }, 500);
            });
            chatButton.addEventListener('touchend', () => { if (longTapTimer) { clearTimeout(longTapTimer); longTapTimer = null; } });
            chatButton.addEventListener('touchcancel', () => { if (longTapTimer) { clearTimeout(longTapTimer); longTapTimer = null; } });

            document.addEventListener('click', (e) => {
                if (chatInput.style.display === 'block' && 
                    !chatInput.contains(e.target) && 
                    !chatButton.contains(e.target)) {
                    hideChatInput();
                }
            });
            chatInput.addEventListener('blur', () => {
                setTimeout(() => {
                    if (document.activeElement !== chatInput) { hideChatInput(); }
                }, 100);
            });
        }

        function showChatInput() {
            if (chatInput && chatButton) {
                chatInput.style.display = 'block';
                chatButton.style.display = 'none';
                chatInput.focus();
            }
        }

        function hideChatInput() {
            if (chatInput && chatButton) {
                chatInput.style.display = 'none';
                chatButton.style.display = 'flex';
                chatInput.value = '';
                chatInput.blur();
            }
        }

        function toggleChatDisabled() {
            chatDisabled = !chatDisabled;
            if (chatDisabled) {
                chatButton.classList.add('disabled');
                hideChatInput();
            } else {
                chatButton.classList.remove('disabled');
            }
        }

        function sendChatMessage() {
            const message = chatInput.value.trim();
            if (message) {
                room.updatePresence({
                    chatMessage: message,
                    chatTimestamp: Date.now()
                });
                
                setTimeout(() => {
                    room.updatePresence({
                        chatMessage: null,
                        chatTimestamp: null
                    });
                }, 5000);
                
                chatInput.value = '';
                chatInput.focus();
            }
        }

        function updateMovement() {
            if (!myHorse || !gameStarted) return;

            let moveX = 0;
            let moveZ = 0;
            
            if (keys['KeyW'] || keys['ArrowUp']) moveZ -= 1;
            if (keys['KeyS'] || keys['ArrowDown']) moveZ += 1;
            if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
            if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

            if (moveX !== 0 || moveZ !== 0) {
                const speedMultiplier = isGalloping && myHorseStats.stamina > 0 ? 1.8 : 1; 
                const baseSpeed = myHorseStats.speed / 1200; 
                const actualSpeed = baseSpeed * speedMultiplier;

                const moveDirection = new THREE.Vector2(moveX, moveZ).normalize();
                myHorse.material.rotation = Math.atan2(moveDirection.x, moveDirection.y);

                myHorse.position.x += moveDirection.x * actualSpeed;
                myHorse.position.z += moveDirection.y * actualSpeed;

                if (isGalloping && myHorseStats.stamina > 0) {
                    myHorseStats.stamina = Math.max(0, myHorseStats.stamina - 0.3); 
                } else if (!isGalloping && myHorseStats.stamina < myHorseStats.maxStamina) {
                    myHorseStats.stamina = Math.min(myHorseStats.maxStamina, myHorseStats.stamina + 0.15); 
                }

                updateStatsDisplay();

                room.updatePresence({
                    x: myHorse.position.x,
                    z: myHorse.position.z,
                    stamina: myHorseStats.stamina,
                });

                updateTerrain(myHorse.position.x, myHorse.position.z);
                
                const targetCameraPos = new THREE.Vector3(myHorse.position.x, camera.position.y, myHorse.position.z + 7);
                camera.position.lerp(targetCameraPos, 0.1);
                controls.target.set(myHorse.position.x, myHorse.position.y + 1, myHorse.position.z);
            } else if (!isGalloping && myHorseStats.stamina < myHorseStats.maxStamina) { 
                myHorseStats.stamina = Math.min(myHorseStats.maxStamina, myHorseStats.stamina + 0.15); 
                updateStatsDisplay();
            }
        }
        
        function updateStatsDisplay() {
            document.getElementById('currentSpeedDisplay').textContent = myHorseStats.speed;
            document.getElementById('currentStaminaDisplay').textContent = Math.floor(myHorseStats.stamina);
            document.getElementById('maxStaminaDisplay').textContent = myHorseStats.maxStamina;
            
            const speedPercent = Math.min(100, (myHorseStats.speed / 100) * 100); 
            document.getElementById('currentSpeedBar').style.width = `${speedPercent}%`;
            document.getElementById('currentStaminaBar').style.width = `${(myHorseStats.stamina / myHorseStats.maxStamina) * 100}%`;
        }

        function createHorseLabel(clientId, username, avatarUrl) {
            const label = document.createElement('div');
            label.className = 'horse-label';
            label.innerHTML = `
                <div class="horse-chat"></div>
                <div class="horse-name-container">
                    <img src="${avatarUrl}" />
                    <span>${username}</span>
                </div>
            `;
            document.body.appendChild(label);
            horseLabels.set(clientId, label);
            return label;
        }

        function updateHorseLabels() {
            horseLabels.forEach((label, clientId) => {
                const horse = horses.get(clientId) || (clientId === room.clientId ? myHorse : null);
                if (horse) {
                    const vector = new THREE.Vector3();
                    vector.setFromMatrixPosition(horse.matrixWorld);
                    vector.y += 1.5; 
                    vector.project(camera);

                    const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                    const y = (vector.y * -0.5 + 0.5) * window.innerHeight;

                    label.style.left = x + 'px';
                    label.style.top = y + 'px';
                    
                    if (chatDisabled) {
                        label.style.display = 'none';
                    } else {
                        label.style.display = vector.z < 1 ? 'flex' : 'none';
                        
                        const presence = room.presence[clientId];
                        const chatDiv = label.querySelector('.horse-chat');
                        if (presence && presence.chatMessage && presence.chatTimestamp) {
                            const timeSince = Date.now() - presence.chatTimestamp;
                            if (timeSince < 5000) { 
                                chatDiv.textContent = presence.chatMessage;
                                chatDiv.style.display = 'block';
                            } else {
                                chatDiv.style.display = 'none';
                            }
                        } else {
                            chatDiv.style.display = 'none';
                        }
                    }
                }
            });
        }

        function createFoodMesh(foodData) {
            const foodDetails = Object.values(FOOD_TYPES).find(ft => ft.type === foodData.type);
            if (!foodDetails) {
                console.warn("Unknown food type:", foodData.type);
                return new THREE.Mesh(); 
            }
            const geometry = foodDetails.geometryFactory();
            const material = new THREE.MeshStandardMaterial({ color: foodDetails.color, metalness: 0.2, roughness: 0.6 });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(foodData.x, foodData.y, foodData.z); 
            mesh.castShadow = true;
            mesh.userData.foodId = foodData.id; 
            return mesh;
        }

        function updateFoodVisuals(allFoodItemsFromServer) {
            if (!room || !scene || !myHorse) return; 

            const currentFoodIdsOnScreen = new Set(foodMeshes.keys());
            const foodItemsFromServerById = new Map(allFoodItemsFromServer.map(item => [item.id, item]));
            const playerChunkX = Math.floor(myHorse.position.x / chunkSize);
            const playerChunkZ = Math.floor(myHorse.position.z / chunkSize);

            allFoodItemsFromServer.forEach(foodData => {
                if (foodData.isEaten) {
                    if (foodMeshes.has(foodData.id)) {
                        scene.remove(foodMeshes.get(foodData.id));
                        foodMeshes.delete(foodData.id);
                    }
                    return;
                }

                const foodChunkX = Math.floor(foodData.x / chunkSize);
                const foodChunkZ = Math.floor(foodData.z / chunkSize);
                const chunkDist = Math.max(Math.abs(foodChunkX - playerChunkX), Math.abs(foodChunkZ - playerChunkZ));

                if (chunkDist <= renderDistance + 1) { 
                    if (!foodMeshes.has(foodData.id)) {
                        const foodMesh = createFoodMesh(foodData);
                        scene.add(foodMesh);
                        foodMeshes.set(foodData.id, foodMesh);
                    }
                } else {
                    if (foodMeshes.has(foodData.id)) {
                        scene.remove(foodMeshes.get(foodData.id));
                        foodMeshes.delete(foodData.id);
                    }
                }
            });

            foodMeshes.forEach((mesh, foodId) => {
                if (!foodItemsFromServerById.has(foodId) || foodItemsFromServerById.get(foodId).isEaten) {
                    scene.remove(mesh);
                    foodMeshes.delete(foodId);
                }
            });
        }

        async function checkForFoodConsumption() {
            if (!myHorse || !room) return;
            const horsePos = myHorse.position;
            const eatRadiusSq = 1.5 * 1.5; 

            for (const [foodId, foodMesh] of foodMeshes) {
                const foodData = room.collection(FOOD_COLLECTION_TYPE).getList().find(f => f.id === foodId);
                if (!foodData || foodData.isEaten) continue;

                const foodPos = foodMesh.position;
                if (horsePos.distanceToSquared(foodPos) < eatRadiusSq) {
                    console.log("Eating food:", foodData.type, foodData.id);
                    try {
                        await room.collection(FOOD_COLLECTION_TYPE).update(foodId, { isEaten: true, eatenBy: room.clientId });
                        
                        myHorseStats.stamina = Math.min(myHorseStats.maxStamina, myHorseStats.stamina + foodData.staminaBoost);
                        
                        if (foodData.statBoostType && foodData.statBoostValue) {
                            let boostApplied = false;
                            if (foodData.statBoostType === "speed") {
                                myHorseStats.speed += foodData.statBoostValue;
                                boostApplied = true;
                            } else if (foodData.statBoostType === "maxStamina") {
                                myHorseStats.maxStamina += foodData.statBoostValue;
                                myHorseStats.stamina = Math.min(myHorseStats.maxStamina, myHorseStats.stamina + foodData.statBoostValue);
                                boostApplied = true;
                            }

                            if (boostApplied) {
                                const playerHorseRecords = room.collection(PLAYER_HORSE_COLLECTION_TYPE).filter({ clientId: room.clientId }).getList();
                                if (playerHorseRecords.length > 0) {
                                    const playerRecord = playerHorseRecords[0];
                                    const updatedPlayerStats = { ...playerRecord.stats, ...myHorseStats };
                                    await room.collection(PLAYER_HORSE_COLLECTION_TYPE).update(playerRecord.id, { stats: updatedPlayerStats });
                                } else { 
                                    console.warn("Player horse record not found for stat update. Creating one.");
                                    const currentUser = room.peers[room.clientId];
                                    await room.collection(PLAYER_HORSE_COLLECTION_TYPE).create({
                                        clientId: room.clientId,
                                        username: currentUser ? currentUser.username : "Player",
                                        image: window.myHorseData ? window.myHorseData.image : horsePreview.src, 
                                        stats: { ...myHorseStats }
                                    });
                                }
                                showNotification(`${foodData.statBoostType.charAt(0).toUpperCase() + foodData.statBoostType.slice(1)} permanently increased by ${foodData.statBoostValue}!`);
                            }
                        }
                        updateStatsDisplay();
                    } catch (error) {
                        console.error("Error consuming food:", error);
                    }
                    break; 
                }
            }
        }
        
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            notificationArea.appendChild(notification);

            setTimeout(() => {
                notification.classList.add('show');
            }, 10); 

            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => {
                    if (notification.parentNode) {
                        notification.parentNode.removeChild(notification);
                    }
                }, 500); 
            }, 3000);
        }

        async function generateHorse() {
            const userPrompt = horsePrompt.value.trim() || "beautiful running";
            const horseColor = document.getElementById('horseColor').value;
            const horseType = document.getElementById('horseType').value;
            
            const fullPrompt = `${horseColor} ${horseType} horse ${userPrompt}`;
            const horseWeightedPrompt = `horse ${fullPrompt.split(' ').map(word => `horse ${word}`).join(' ')} horse`;
            
            generateBtn.disabled = true;
            loadingText.style.display = 'block';
            
            try {
                const result = await websim.imageGen({
                    prompt: `${horseWeightedPrompt}, full body horse, horse game sprite, horse clean background, detailed horse, beautiful horse`,
                    transparent: true,
                    aspect_ratio: "1:1"
                });
                
                const response = await fetch(result.url);
                const blob = await response.blob();
                const uploadedUrl = await websim.upload(blob);
                
                horsePreview.src = uploadedUrl;
                horsePreview.style.display = 'block';
                startBtn.disabled = false;
                
                myHorseStats.speed = Math.floor(Math.random() * 50) + 25; 
                myHorseStats.stamina = 100;
                myHorseStats.maxStamina = Math.floor(Math.random() * 50) + 75; 
                
                window.myHorseData = {
                    image: uploadedUrl,
                    stats: { ...myHorseStats }
                };
            } catch (error) {
                console.error('Error generating horse:', error);
                alert('Failed to generate horse. Please try again.');
            } finally {
                generateBtn.disabled = false;
                loadingText.style.display = 'none';
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            
            updateMovement();
            updateHorseLabels();
            checkForFoodConsumption();
            controls.update();
            renderer.render(scene, camera);
        }

        generateBtn.addEventListener('click', generateHorse);
        
        startBtn.addEventListener('click', async () => {
            if (!window.myHorseData) return;

            horseCreatorUI.style.display = 'none';
            gameUI.style.display = 'none';
            controlsDiv.style.display = 'none';
            document.getElementById('ui').style.display = 'none';
            gameStarted = true;

            myHorse = await createHorseSprite(window.myHorseData.image);
            myHorse.position.set(0, 2, 0);
            scene.add(myHorse);

            room.updatePresence({
                horseImage: window.myHorseData.image,
                stats: window.myHorseData.stats,
                x: 0,
                z: 0,
                stamina: myHorseStats.stamina
            });

            updateStatsDisplay();
            
            const currentUser = room.peers[room.clientId];
            if (currentUser) {
                createHorseLabel(room.clientId, currentUser.username, currentUser.avatarUrl);
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        async function init() {
            initScene();
            await initMultiplayer();
            setupControls();
            animate();
        }

        init();
    </script>
